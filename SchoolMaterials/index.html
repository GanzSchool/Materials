<!doctype html>
<html lang="hu" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f5f7" />
  <title>SchoolMaterials</title>
  <style>
    :root{color-scheme:light;--bg:#f4f5f7;--surface:#fff;--surface-2:#eef1f3;--surface-3:#e8ecef;--text:#17191d;--muted:#66707b;--line:#dde2e6;--accent:#087a67;--accent-soft:#e4f4ef;--accent-text:#056453;--code:#10171f;--code-text:#dbe7ee;--visual-bg:#e5eeeb;--visual-bg-2:#dce8e4;--visual-line:#c8d8d3;--terminal:#1a2933;--terminal-head:#21323d;--terminal-line:#3a4a55;--terminal-muted:#8fa0ac;--shadow:0 18px 48px rgba(28,36,44,.08);--header:62px;--sidebar:288px}
    [data-theme="dark"]{color-scheme:dark;--bg:#0e1114;--surface:#15191d;--surface-2:#1c2126;--surface-3:#252b31;--text:#f2f4f5;--muted:#9aa4ae;--line:#2a3036;--accent:#52cdb3;--accent-soft:#17362f;--accent-text:#7de0ca;--code:#111a21;--code-text:#dbe7ee;--visual-bg:#1d292a;--visual-bg-2:#223130;--visual-line:#31413f;--terminal:#1b2831;--terminal-head:#22333d;--terminal-line:#40505a;--terminal-muted:#93a4af;--shadow:0 20px 56px rgba(0,0,0,.25)}
    *{box-sizing:border-box}html,body{margin:0;min-width:320px;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}body{transition:background-color .22s ease,color .22s ease}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app-header{height:var(--header);position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.header-inner{height:100%;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer;font-weight:760;font-size:17px;letter-spacing:-.35px}.brand-mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--text);color:var(--surface);font-size:10px;font-weight:850}.header-actions{display:flex;gap:8px;align-items:center}.icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center;cursor:pointer}.icon-btn svg{width:17px;height:17px}.menu-btn{display:none}.home{width:min(1160px,calc(100% - 40px));margin:0 auto;padding:58px 0 72px}.home-head{margin-bottom:24px}.home-label{margin:0 0 7px;color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.home h1{margin:0;font-size:clamp(34px,5vw,52px);line-height:1.04;letter-spacing:-1.9px}.home-copy{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.6}.sql-card{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,.92fr) minmax(380px,1.08fr);text-align:left;cursor:pointer}.sql-info{padding:clamp(28px,4.8vw,58px);display:flex;flex-direction:column;justify-content:center;min-height:390px}.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:38px;color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.11em}.eyebrow-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.sql-info h2{margin:0 0 10px;font-size:clamp(52px,7vw,82px);letter-spacing:-3.5px;line-height:.93}.sql-info p{margin:0;max-width:520px;color:var(--muted);font-size:15px;line-height:1.65}.sql-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}.sql-meta span{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:11px;font-weight:650}.course-cta{display:inline-flex;align-items:center;gap:9px;margin-top:34px;color:var(--text);font-size:13px;font-weight:750}.course-cta i{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-style:normal}.course-cta svg{width:16px;height:16px}.sql-visual{position:relative;min-height:362px;margin:14px 14px 14px 0;border:1px solid var(--visual-line);border-radius:19px;background:linear-gradient(145deg,var(--visual-bg),var(--visual-bg-2));display:grid;place-items:center;padding:34px;overflow:hidden}.terminal{position:relative;z-index:2;width:min(500px,100%);border:1px solid var(--terminal-line);border-radius:16px;background:var(--terminal);overflow:hidden}.terminal-head{height:42px;border-bottom:1px solid var(--terminal-line);background:var(--terminal-head);display:flex;align-items:center;gap:7px;padding:0 14px;color:var(--terminal-muted);font-size:10px}.terminal-dot{width:7px;height:7px;border-radius:50%;background:#60717d}.terminal-title{margin-left:6px}.terminal-body{padding:22px}.query{font:12px/1.72 "SFMono-Regular",Consolas,monospace;color:#d7e0e6}.kw{color:#78dfc8}.str{color:#f0cd8e}.result{margin-top:20px;border-top:1px solid var(--terminal-line);padding-top:16px}.result-head,.result-row{display:grid;grid-template-columns:48px 1fr 76px;gap:12px;align-items:center}.result-head{color:#81919d;font:9px/1.3 Consolas,monospace;text-transform:uppercase;padding:0 8px 8px}.result-row{min-height:34px;padding:0 8px;border-top:1px solid var(--terminal-line);color:#c1cbd2;font:10px/1.3 Consolas,monospace}.upcoming-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}.upcoming-card{min-height:164px;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:22px}.upcoming-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:34px}.upcoming-code{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 8px;border-radius:9px;background:var(--surface-2);color:var(--muted);font-size:10px;font-weight:800}.upcoming-state{font-size:10px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.upcoming-card h3{margin:0 0 6px;font-size:24px;letter-spacing:-.7px}.upcoming-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.learning-shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:calc(100vh - var(--header))}.course-sidebar{position:sticky;top:var(--header);width:var(--sidebar);height:calc(100vh - var(--header));overflow-y:scroll;scrollbar-gutter:stable;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px 28px}.sidebar-head{padding:0 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}.sidebar-home{border:0;background:none;padding:3px 0 14px;color:var(--muted);font-size:12px;cursor:pointer}.sidebar-head h2{margin:0;font-size:22px}.sidebar-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.accordion{display:grid;gap:7px}.module-toggle{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 18px;align-items:center;gap:8px;border:0;border-radius:10px;background:transparent;padding:11px 10px;text-align:left;cursor:pointer}.module-toggle.active,.module-toggle.expanded{background:var(--accent-soft)}.module-toggle small{display:block;margin-bottom:3px;color:var(--muted);font-size:9px;font-weight:800;text-transform:uppercase}.module-toggle strong{display:block;font-size:13px}.module-lessons{display:none;padding:4px 0 7px 8px}.module-lessons.expanded{display:grid;gap:2px}.sidebar-lesson{width:100%;min-height:38px;border:0;background:transparent;border-radius:8px;padding:8px 10px;color:var(--muted);text-align:left;font-size:12px;cursor:pointer}.sidebar-lesson.active{background:var(--accent-soft);color:var(--accent-text)}.main-pane{min-width:0;padding:40px clamp(24px,5vw,64px) 64px}.lesson{width:min(820px,100%);margin:0 auto}.crumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-bottom:24px}.crumb button{border:0;background:none;padding:0;color:var(--muted);cursor:pointer}.lesson-kicker{margin:0 0 10px;color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase}.lesson h1{margin:0 0 28px;font-size:clamp(32px,4.7vw,50px);line-height:1.08;letter-spacing:-1.7px}.material{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:clamp(20px,4vw,30px)}.material p{color:var(--muted)}pre{background:var(--code);color:var(--code-text);padding:17px;border-radius:12px;overflow:auto}.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.pager-btn{max-width:48%;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:11px 13px;font-size:12px;font-weight:650;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.backdrop{display:none}@media(max-width:900px){:root{--sidebar:252px}.sql-card{grid-template-columns:1fr minmax(300px,.9fr)}.main-pane{padding-left:24px;padding-right:24px}}@media(max-width:720px){:root{--header:58px}.menu-btn{display:grid}.learning-shell{display:block}.course-sidebar{position:fixed;z-index:90;top:var(--header);left:0;bottom:0;width:min(86vw,310px);height:auto;transform:translateX(-103%)}.course-sidebar.open{transform:translateX(0)}.backdrop.open{display:block;position:fixed;z-index:80;inset:var(--header) 0 0;background:rgba(0,0,0,.38)}.home{width:min(100% - 28px,1160px);padding:36px 0 48px}.sql-card{grid-template-columns:1fr}.sql-visual{margin:0 14px 14px}.upcoming-grid{grid-template-columns:1fr}.pager{flex-direction:column}.pager-btn{max-width:none;width:100%}}
  </style>
</head>
<body>
<header class="app-header"><div class="header-inner"><button class="brand" id="brandBtn"><span class="brand-mark">SM</span><span>SchoolMaterials</span></button><div class="header-actions"><button class="icon-btn menu-btn" id="menuBtn"></button><button class="icon-btn" id="themeBtn"></button></div></div></header><div id="app"></div>
<script>
const modules=[{title:'Adatbázis-kezelés 1',lessons:['Adatbázis, tábla, rekord, mező és az SQL alapjai','SELECT, FROM és oszlopok lekérdezése','WHERE és összehasonlító feltételek','DISTINCT, ORDER BY, ASC és DESC','Több feltétel – AND, OR, NOT','NULL, IS NULL és IS NOT NULL','Adatmódosítás – INSERT, UPDATE, DELETE','Összesítés – COUNT, SUM, AVG, MIN, MAX','Csoportosítás – GROUP BY és HAVING','Rendezés, szűrés, csoportosítás és összesítés egy lekérdezésben','Adatbázis és tábla létrehozása','SQL adattípusok','Alapvető megszorítások – PRIMARY KEY, NOT NULL, UNIQUE','Egytáblás komplex gyakorlás','Egytáblás SQL számonkérés']},{title:'Adatbázis-kezelés 2',lessons:['Relációs adatbázisok felépítése','Elsődleges és idegen kulcsok','Táblák közötti kapcsolatok','Többtáblás adatbázis létrehozása','Adatbázis-tervezés','Redundanciamentes adatbázis-tervezés','Adatbázismodell-diagram készítése','Többtáblás lekérdezések alapjai','INNER JOIN','Külső JOIN-ok, elsősorban LEFT JOIN','Több tábla összekapcsolása egy lekérdezésben','JOIN + WHERE + ORDER BY','JOIN + összesítő függvények','JOIN + GROUP BY + HAVING','Összetett / haladó SQL-lekérdezések','Komplex többtáblás adatbázis-tervezési feladat','Adatbázis exportálása / dump készítése','Adatbázis használata backend alkalmazásból','Adatbázist használó REST API','ORM – objektum-relációs leképezés','Adatbázist kezelő konzolos / grafikus alkalmazás','Komplex webes + adatbázis-kezelési vizsgafeladat','Szakmai vizsga típusú adatbázis-feladatok']}];
const app=document.getElementById('app'),themeBtn=document.getElementById('themeBtn'),menuBtn=document.getElementById('menuBtn'),brandBtn=document.getElementById('brandBtn');const moon='☾',sun='☀',arrow='›';function setTheme(t){document.documentElement.dataset.theme=t;themeBtn.textContent=t==='dark'?sun:moon;localStorage.setItem('schoolmaterials-theme',t)}setTheme(localStorage.getItem('schoolmaterials-theme')||'light');themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');brandBtn.onclick=showHome;menuBtn.textContent='☰';let learningMounted=false;function flatLessons(){return modules.flatMap((m,mi)=>m.lessons.map((title,li)=>({mi,li,title})))}function flatIndex(mi,li){return modules.slice(0,mi).reduce((n,m)=>n+m.lessons.length,0)+li}function sidebarHtml(){return `<aside class="course-sidebar" id="sidebar"><div class="sidebar-head"><button class="sidebar-home" data-home>← Kezdőlap</button><h2>SQL</h2><p>Tananyagok</p></div><div class="accordion">${modules.map((m,mi)=>`<div><button class="module-toggle" data-module="${mi}"><span><small>Rész ${mi+1}</small><strong>${m.title}</strong></span></button><div class="module-lessons" data-lessons="${mi}">${m.lessons.map((l,li)=>`<button class="sidebar-lesson" data-mi="${mi}" data-li="${li}">${l}</button>`).join('')}</div></div>`).join('')}</div></aside><div class="backdrop" id="backdrop"></div>`}function mountLearningShell(){if(learningMounted)return;app.innerHTML=`<div class="learning-shell">${sidebarHtml()}<main class="main-pane" id="mainPane"></main></div>`;learningMounted=true;document.querySelector('[data-home]').onclick=showHome;document.querySelectorAll('[data-module]').forEach(btn=>btn.onclick=()=>{const mi=Number(btn.dataset.module);document.querySelectorAll('[data-lessons]').forEach(p=>p.classList.remove('expanded'));document.querySelector(`[data-lessons="${mi}"]`).classList.add('expanded')});document.querySelectorAll('[data-mi]').forEach(btn=>btn.onclick=()=>showLesson(Number(btn.dataset.mi),Number(btn.dataset.li)))}function showHome(){learningMounted=false;menuBtn.style.display='none';app.innerHTML=`<main class="home"><header class="home-head"><p class="home-label">SchoolMaterials</p><h1>Tananyagok</h1><p class="home-copy">Belső oktatási felület.</p></header><button class="sql-card" id="sqlCard"><div class="sql-info"><div class="eyebrow"><span class="eyebrow-dot"></span>SQL tananyag</div><h2>SQL</h2><p>Adatbázis-kezelés, lekérdezések, relációs adatbázisok és a szakmai vizsgához szükséges témák.</p><div class="sql-meta"><span>Adatbázis-kezelés 1</span><span>Adatbázis-kezelés 2</span></div><div class="course-cta">Megnyitás <i>${arrow}</i></div></div><div class="sql-visual"><div class="terminal"><div class="terminal-head"><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-title">query.sql</span></div><div class="terminal-body"><div class="query"><div><span class="kw">SELECT</span> id, nev, osztaly</div><div><span class="kw">FROM</span> tanulok</div><div><span class="kw">WHERE</span> atlag &gt; <span class="str">4.0</span></div></div><div class="result"><div class="result-head"><span>ID</span><span>NÉV</span><span>OSZTÁLY</span></div><div class="result-row"><span>01</span><span>Kiss Anna</span><span>10.A</span></div><div class="result-row"><span>07</span><span>Nagy Máté</span><span>10.B</span></div><div class="result-row"><span>12</span><span>Tóth Luca</span><span>11.A</span></div></div></div></div></div></button><section class="upcoming-grid"><article class="upcoming-card"><div class="upcoming-top"><span class="upcoming-code">JS</span><span class="upcoming-state">Hamarosan</span></div><h3>JavaScript</h3><p>Programozási alapok, DOM, események és aszinkron működés.</p></article><article class="upcoming-card"><div class="upcoming-top"><span class="upcoming-code">FE</span><span class="upcoming-state">Hamarosan</span></div><h3>Frontend</h3><p>Kliensoldali webfejlesztés, felületek és modern frontend technológiák.</p></article><article class="upcoming-card"><div class="upcoming-top"><span class="upcoming-code">BE</span><span class="upcoming-state">Hamarosan</span></div><h3>Backend</h3><p>Szerveroldali fejlesztés, API-k, adatkezelés és alkalmazáslogika.</p></article></section></main>`;document.getElementById('sqlCard').onclick=()=>showLesson(0,0)}function showLesson(mi,li){menuBtn.style.display='';mountLearningShell();document.querySelectorAll('[data-lessons]').forEach(p=>p.classList.remove('expanded'));document.querySelector(`[data-lessons="${mi}"]`).classList.add('expanded');document.querySelectorAll('.sidebar-lesson').forEach(b=>b.classList.toggle('active',Number(b.dataset.mi)===mi&&Number(b.dataset.li)===li));const flat=flatLessons(),idx=flatIndex(mi,li),prev=flat[idx-1],next=flat[idx+1],title=modules[mi].lessons[li];document.getElementById('mainPane').innerHTML=`<article class="lesson"><div class="crumb"><button id="homeCrumb">Kezdőlap</button><span>/</span><span>SQL</span><span>/</span><span>${modules[mi].title}</span></div><p class="lesson-kicker">${modules[mi].title}</p><h1>${title}</h1><section class="material"><h2>Tananyag</h2><p>A részletes oktatási tartalom ide kerül.</p><pre>SELECT *\nFROM tabla;</pre></section><nav class="pager"><button class="pager-btn" id="prev" ${prev?'':'disabled'}>${prev?'← '+prev.title:'← Előző'}</button><button class="pager-btn" id="next" ${next?'':'disabled'}>${next?next.title+' →':'Következő →'}</button></nav></article>`;document.getElementById('homeCrumb').onclick=showHome;if(prev)document.getElementById('prev').onclick=()=>showLesson(prev.mi,prev.li);if(next)document.getElementById('next').onclick=()=>showLesson(next.mi,next.li)}showHome();
</script></body></html>
