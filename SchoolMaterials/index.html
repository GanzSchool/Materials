<!doctype html>
<html lang="hu" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7f9" />
  <title>SchoolMaterials</title>
  <style>
    :root {
      color-scheme: light;
      --bg:#f6f7f9;
      --surface:#ffffff;
      --surface-2:#f0f2f5;
      --text:#15181d;
      --muted:#6d7580;
      --line:#dfe3e8;
      --accent:#0d7c66;
      --accent-strong:#075f4e;
      --accent-soft:#e5f5f1;
      --code:#111820;
      --code-text:#dce7ee;
      --shadow:0 12px 32px rgba(18,25,33,.07);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg:#0f1216;
      --surface:#15191e;
      --surface-2:#1b2026;
      --text:#f2f4f7;
      --muted:#9da6b2;
      --line:#2a3038;
      --accent:#4ccfb2;
      --accent-strong:#7fe1ca;
      --accent-soft:#17352e;
      --code:#090c10;
      --code-text:#dce7ee;
      --shadow:0 16px 42px rgba(0,0,0,.24);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-width:320px;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,select{font:inherit}
    button{color:inherit}
    .app-header{position:sticky;top:0;z-index:60;height:64px;background:color-mix(in srgb,var(--surface) 94%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
    .header-inner{height:100%;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{border:0;background:transparent;padding:0;display:inline-flex;align-items:center;gap:11px;cursor:pointer;font-size:17px;font-weight:780;letter-spacing:-.35px}
    .brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--text);color:var(--surface);font-size:11px;font-weight:850}
    .header-actions{display:flex;align-items:center;gap:8px}
    .icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer}
    .icon-btn:hover{background:var(--surface-2)}
    .icon-btn svg{width:18px;height:18px}
    .menu-btn{display:none}
    .home{width:min(1050px,calc(100% - 40px));margin:0 auto;padding:64px 0 80px}
    .section-kicker{margin:0 0 10px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
    .section-title{margin:0;font-size:clamp(36px,5vw,56px);line-height:1.03;letter-spacing:-2px}
    .section-copy{margin:14px 0 30px;max-width:630px;color:var(--muted);font-size:16px;line-height:1.65}
    .course-card{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:clamp(24px,4vw,38px);box-shadow:var(--shadow);cursor:pointer;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:26px}
    .course-card:hover{border-color:color-mix(in srgb,var(--accent) 48%,var(--line));transform:translateY(-2px)}
    .course-label{display:inline-flex;align-items:center;gap:8px;margin-bottom:26px;color:var(--accent);font-size:12px;font-weight:780;text-transform:uppercase;letter-spacing:.08em}
    .course-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
    .course-card h2{margin:0 0 9px;font-size:clamp(36px,5vw,54px);line-height:1;letter-spacing:-1.8px}
    .course-card p{margin:0;max-width:650px;color:var(--muted);line-height:1.6}
    .course-open{width:48px;height:48px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center}
    [data-theme="dark"] .course-open{color:#09251e}
    .course-open svg{width:20px;height:20px}
    .course-shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 64px)}
    .course-sidebar{position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 34px}
    .sidebar-top{padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
    .sidebar-home{border:0;background:transparent;color:var(--muted);padding:4px 0 14px;cursor:pointer;font-size:12px}
    .sidebar-home:hover{color:var(--text)}
    .sidebar-course{margin:0;font-size:22px;letter-spacing:-.5px}
    .sidebar-course-sub{margin:4px 0 0;color:var(--muted);font-size:12px}
    .accordion{display:grid;gap:8px}
    .module-toggle{width:100%;border:0;background:transparent;border-radius:11px;padding:11px 10px;display:grid;grid-template-columns:minmax(0,1fr) 22px;align-items:center;gap:8px;text-align:left;cursor:pointer}
    .module-toggle:hover{background:var(--surface-2)}
    .module-toggle.active{background:var(--accent-soft)}
    .module-toggle small{display:block;margin-bottom:3px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .module-toggle strong{display:block;font-size:13px;line-height:1.3}
    .module-toggle.active strong{color:var(--accent-strong)}
    .chevron{display:grid;place-items:center;color:var(--muted);transition:transform .18s ease}
    .module-toggle.expanded .chevron{transform:rotate(90deg)}
    .chevron svg{width:16px;height:16px}
    .module-lessons{display:none;padding:3px 0 6px 10px}
    .module-lessons.expanded{display:grid;gap:2px}
    .sidebar-lesson{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:12px;line-height:1.35}
    .sidebar-lesson:hover{background:var(--surface-2);color:var(--text)}
    .sidebar-lesson.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
    .course-main{min-width:0;padding:44px clamp(28px,5vw,72px) 72px}
    .content-wrap{width:min(900px,100%);margin:0 auto}
    .breadcrumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;margin-bottom:28px}
    .breadcrumb button{border:0;background:transparent;color:var(--muted);padding:0;cursor:pointer}
    .breadcrumb button:hover{color:var(--text)}
    .course-header{padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:28px}
    .course-header h1{margin:0 0 10px;font-size:clamp(44px,7vw,72px);line-height:.98;letter-spacing:-2.6px}
    .course-header p{margin:0;max-width:720px;color:var(--muted);line-height:1.65}
    .module-overview{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .module-card{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:24px;text-align:left;cursor:pointer}
    .module-card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow)}
    .module-card small{display:block;margin-bottom:28px;color:var(--accent);font-weight:800;font-size:10px;letter-spacing:.09em;text-transform:uppercase}
    .module-card h2{margin:0 0 7px;font-size:21px;letter-spacing:-.5px}
    .module-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
    .lesson-meta{margin-bottom:13px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
    .lesson-title{margin:0 0 30px;font-size:clamp(36px,5.2vw,58px);line-height:1.04;letter-spacing:-2px;overflow-wrap:anywhere}
    .material-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4vw,34px)}
    .material-card h2{margin:0 0 8px;font-size:19px}
    .material-card p{margin:0;color:var(--muted);line-height:1.7}
    .sample-block{margin-top:24px}
    .sample-label{margin-bottom:8px;color:var(--muted);font-size:12px;font-weight:700}
    pre{margin:0;background:var(--code);color:var(--code-text);border-radius:13px;padding:18px;overflow-x:auto;font:13px/1.6 "SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
    .nav-btn{max-width:48%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;cursor:pointer;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nav-btn:hover{background:var(--surface-2)}
    .nav-btn:disabled{opacity:.35;cursor:default}
    .mobile-sidebar-backdrop{display:none}
    @media(max-width:900px){.course-shell{grid-template-columns:260px minmax(0,1fr)}.course-main{padding-left:28px;padding-right:28px}.module-overview{grid-template-columns:1fr}}
    @media(max-width:720px){
      .app-header{height:60px}.header-inner{padding:0 14px}.brand{font-size:16px}.brand-mark{width:31px;height:31px}.menu-btn{display:grid}.course-shell{display:block;min-height:calc(100vh - 60px)}
      .course-sidebar{position:fixed;top:60px;left:0;bottom:0;width:min(86vw,320px);height:auto;z-index:80;transform:translateX(-105%);transition:transform .2s ease;box-shadow:20px 0 50px rgba(0,0,0,.14)}.course-sidebar.open{transform:translateX(0)}
      .mobile-sidebar-backdrop{position:fixed;inset:60px 0 0 0;z-index:70;background:rgba(0,0,0,.38);display:none}.mobile-sidebar-backdrop.open{display:block}.course-main{padding:28px 16px 50px}.content-wrap{width:100%}.breadcrumb{margin-bottom:22px}.course-header{margin-bottom:20px}.lesson-title{margin-bottom:22px}.lesson-nav{flex-direction:column}.nav-btn{max-width:none;width:100%}.home{width:min(100% - 28px,1050px);padding:38px 0 50px}.course-card{grid-template-columns:1fr;padding:24px;gap:20px}.course-label{margin-bottom:18px}
    }
  </style>
</head>
<body>
  <header class="app-header"><div class="header-inner"><button class="brand" id="brandBtn" aria-label="Kezdőlap"><span class="brand-mark">SM</span><span>SchoolMaterials</span></button><div class="header-actions"><button class="icon-btn menu-btn" id="menuBtn" aria-label="Tartalom megnyitása" title="Tartalom"></button><button class="icon-btn" id="themeBtn" aria-label="Téma váltása" title="Téma váltása"></button></div></div></header>
  <div id="app"></div>
  <script>
    const modules=[
      {title:'Adatbázis-kezelés 1',description:'SQL alapok és egytáblás adatkezelés',lessons:['Adatbázis, tábla, rekord, mező és az SQL alapjai','SELECT, FROM és oszlopok lekérdezése','WHERE és összehasonlító feltételek','DISTINCT, ORDER BY, ASC és DESC','Több feltétel – AND, OR, NOT','NULL, IS NULL és IS NOT NULL','Adatmódosítás – INSERT, UPDATE, DELETE','Összesítés – COUNT, SUM, AVG, MIN, MAX','Csoportosítás – GROUP BY és HAVING','Rendezés, szűrés, csoportosítás és összesítés egy lekérdezésben','Adatbázis és tábla létrehozása','SQL adattípusok','Alapvető megszorítások – PRIMARY KEY, NOT NULL, UNIQUE','Egytáblás komplex gyakorlás','Egytáblás SQL számonkérés']},
      {title:'Adatbázis-kezelés 2',description:'Relációs adatbázisok és komplex adatbázis-kezelés',lessons:['Relációs adatbázisok felépítése','Elsődleges és idegen kulcsok','Táblák közötti kapcsolatok','Többtáblás adatbázis létrehozása','Adatbázis-tervezés','Redundanciamentes adatbázis-tervezés','Adatbázismodell-diagram készítése','Többtáblás lekérdezések alapjai','INNER JOIN','Külső JOIN-ok, elsősorban LEFT JOIN','Több tábla összekapcsolása egy lekérdezésben','JOIN + WHERE + ORDER BY','JOIN + összesítő függvények','JOIN + GROUP BY + HAVING','Összetett / haladó SQL-lekérdezések','Komplex többtáblás adatbázis-tervezési feladat','Adatbázis exportálása / dump készítése','Adatbázis használata backend alkalmazásból','Adatbázist használó REST API','ORM – objektum-relációs leképezés','Adatbázist kezelő konzolos / grafikus alkalmazás','Komplex webes + adatbázis-kezelési vizsgafeladat','Szakmai vizsga típusú adatbázis-feladatok']}
    ];
    const app=document.getElementById('app'),themeBtn=document.getElementById('themeBtn'),menuBtn=document.getElementById('menuBtn'),brandBtn=document.getElementById('brandBtn');
    const sunIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.6"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>',moonIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.3 15.5A8.5 8.5 0 0 1 8.5 3.7 8.5 8.5 0 1 0 20.3 15.5Z"/></svg>',arrowIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg>',menuIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
    menuBtn.innerHTML=menuIcon;
    const savedTheme=localStorage.getItem('schoolmaterials-theme'),preferredDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;setTheme(savedTheme||(preferredDark?'dark':'light'));
    function setTheme(theme){document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').setAttribute('content',theme==='dark'?'#0f1216':'#f6f7f9');themeBtn.innerHTML=theme==='dark'?sunIcon:moonIcon;themeBtn.title=theme==='dark'?'Világos téma':'Sötét téma';localStorage.setItem('schoolmaterials-theme',theme)}
    themeBtn.addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));brandBtn.addEventListener('click',showHome);menuBtn.addEventListener('click',toggleMobileSidebar);
    function sidebarHtml(openModule,activeModule=-1,activeLesson=-1){return `<aside class="course-sidebar" id="courseSidebar"><div class="sidebar-top"><button class="sidebar-home" data-home>← Kezdőlap</button><h2 class="sidebar-course">SQL</h2><p class="sidebar-course-sub">Tananyag</p></div><div class="accordion">${modules.map((m,mi)=>`<div class="accordion-item"><button class="module-toggle ${mi===activeModule?'active':''} ${mi===openModule?'expanded':''}" data-module-toggle="${mi}"><span><small>Rész ${String(mi+1).padStart(2,'0')}</small><strong>${m.title}</strong></span><span class="chevron">${arrowIcon}</span></button><div class="module-lessons ${mi===openModule?'expanded':''}" data-module-lessons="${mi}">${m.lessons.map((lesson,li)=>`<button class="sidebar-lesson ${mi===activeModule&&li===activeLesson?'active':''}" data-lesson-module="${mi}" data-lesson-index="${li}">${lesson}</button>`).join('')}</div></div>`).join('')}</div></aside><div class="mobile-sidebar-backdrop" id="sidebarBackdrop"></div>`}
    function bindSidebar(openModule,onLesson){document.querySelector('[data-home]')?.addEventListener('click',showHome);document.querySelectorAll('[data-module-toggle]').forEach(btn=>{btn.addEventListener('click',()=>{const mi=Number(btn.dataset.moduleToggle);document.querySelectorAll('[data-module-toggle]').forEach(b=>b.classList.remove('expanded'));document.querySelectorAll('[data-module-lessons]').forEach(p=>p.classList.remove('expanded'));if(mi!==openModule){btn.classList.add('expanded');document.querySelector(`[data-module-lessons="${mi}"]`).classList.add('expanded');openModule=mi}else openModule=-1})});document.querySelectorAll('[data-lesson-module]').forEach(btn=>{btn.addEventListener('click',()=>{closeMobileSidebar();onLesson(Number(btn.dataset.lessonModule),Number(btn.dataset.lessonIndex))})});document.getElementById('sidebarBackdrop')?.addEventListener('click',closeMobileSidebar)}
    function toggleMobileSidebar(){document.getElementById('courseSidebar')?.classList.toggle('open');document.getElementById('sidebarBackdrop')?.classList.toggle('open')}function closeMobileSidebar(){document.getElementById('courseSidebar')?.classList.remove('open');document.getElementById('sidebarBackdrop')?.classList.remove('open')}
    function showHome(){closeMobileSidebar();menuBtn.style.display='none';window.scrollTo(0,0);app.innerHTML=`<main class="home"><p class="section-kicker">Tananyagok</p><h1 class="section-title">SchoolMaterials</h1><p class="section-copy">Belső oktatási felület a tanórai és gyakorló anyagokhoz.</p><button class="course-card" id="sqlCard"><div><div class="course-label"><span class="course-dot"></span>Elérhető tananyag</div><h2>SQL</h2><p>Adatbázis-kezelés, lekérdezések, relációs adatbázisok és a szakmai vizsgához szükséges témák.</p></div><span class="course-open" aria-hidden="true">${arrowIcon}</span></button></main>`;document.getElementById('sqlCard').addEventListener('click',()=>showCourse(0))}
    function showCourse(openModule=0){menuBtn.style.display='';window.scrollTo(0,0);app.innerHTML=`<div class="course-shell">${sidebarHtml(openModule)}<main class="course-main"><div class="content-wrap"><div class="breadcrumb"><button id="homeCrumb">Kezdőlap</button><span>/</span><span>SQL</span></div><header class="course-header"><h1>SQL</h1><p>Az SQL tananyag két egymásra épülő részben vezeti végig az adatbázis-kezelés alapjaitól a relációs adatbázisokon és összetett lekérdezéseken át az alkalmazásból történő adatkezelésig.</p></header><div class="module-overview">${modules.map((m,mi)=>`<button class="module-card" data-open-module="${mi}"><small>Rész ${String(mi+1).padStart(2,'0')}</small><h2>${m.title}</h2><p>${m.description}</p></button>`).join('')}</div></div></main></div>`;document.getElementById('homeCrumb').addEventListener('click',showHome);bindSidebar(openModule,showLesson);document.querySelectorAll('[data-open-module]').forEach(btn=>{btn.addEventListener('click',()=>{const mi=Number(btn.dataset.openModule),toggle=document.querySelector(`[data-module-toggle="${mi}"]`),lessons=document.querySelector(`[data-module-lessons="${mi}"]`);document.querySelectorAll('[data-module-toggle]').forEach(b=>b.classList.remove('expanded'));document.querySelectorAll('[data-module-lessons]').forEach(p=>p.classList.remove('expanded'));toggle.classList.add('expanded');lessons.classList.add('expanded');if(window.innerWidth<=720){document.getElementById('courseSidebar').classList.add('open');document.getElementById('sidebarBackdrop').classList.add('open')}})})}
    function allLessons(){return modules.flatMap((m,mi)=>m.lessons.map((title,li)=>({moduleIndex:mi,lessonIndex:li,title,moduleTitle:m.title})))}function lessonFlatIndex(mi,li){return modules.slice(0,mi).reduce((sum,m)=>sum+m.lessons.length,0)+li}
    function showLesson(moduleIndex,lessonIndex){menuBtn.style.display='';window.scrollTo(0,0);const module=modules[moduleIndex],title=module.lessons[lessonIndex],flat=allLessons(),current=lessonFlatIndex(moduleIndex,lessonIndex),prev=flat[current-1],next=flat[current+1];app.innerHTML=`<div class="course-shell">${sidebarHtml(moduleIndex,moduleIndex,lessonIndex)}<main class="course-main"><div class="content-wrap"><div class="breadcrumb"><button id="courseCrumb">SQL</button><span>/</span><span>${module.title}</span></div><div class="lesson-meta">${module.title}</div><h1 class="lesson-title">${title}</h1><section class="material-card"><h2>Tananyag</h2><p>A részletes oktatási tartalom ide kerül.</p><div class="sample-block"><div class="sample-label">SQL példa</div><pre><code>SELECT *\nFROM tabla;</code></pre></div></section><nav class="lesson-nav"><button class="nav-btn" id="prevBtn" ${prev?'':'disabled'}>${prev?'← '+prev.title:'← Előző'}</button><button class="nav-btn" id="nextBtn" ${next?'':'disabled'}>${next?next.title+' →':'Következő →'}</button></nav></div></main></div>`;document.getElementById('courseCrumb').addEventListener('click',()=>showCourse(moduleIndex));bindSidebar(moduleIndex,showLesson);if(prev)document.getElementById('prevBtn').addEventListener('click',()=>showLesson(prev.moduleIndex,prev.lessonIndex));if(next)document.getElementById('nextBtn').addEventListener('click',()=>showLesson(next.moduleIndex,next.lessonIndex))}
    showHome();
  </script>
</body>
</html>
