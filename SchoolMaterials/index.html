@media(max-width:720px){:root{--header:58px}.app-header{height:var(--header)}.header-inner{padding:0 12px}.brand{font-size:15px}.brand-mark{width:30px;height:30px}.menu-btn{display:grid}.learning-shell{display:block;min-height:calc(100vh - var(--header))}.course-sidebar{position:fixed;z-index:90;top:var(--header);left:0;bottom:0;width:min(86vw,310px);height:auto;transform:translateX(-103%);transition:transform .2s;box-shadow:18px 0 42px rgba(0,0,0,.18)}.course-sidebar.open{transform:none}.backdrop{position:fixed;z-index:80;inset:var(--header) 0 0;background:rgba(0,0,0,.38);display:none}.backdrop.open{display:block}.main-pane{padding:26px 15px 44px}.pager{flex-direction:column}.pager-btn{max-width:none;width:100%}.home{width:min(100% - 28px,1160px);padding:36px 0 48px}.course-card{grid-template-columns:1fr}.course-info{min-height:auto;padding:28px}.eyebrow{margin-bottom:26px}.course-visual{min-height:290px;margin:0 14px 14px;border-radius:16px;padding:22px}.browser-canvas{height:auto;min-height:270px}.flow{height:210px}}
@media(max-width:460px){.home{width:min(100% - 20px,1160px)}.course-info{padding:24px 20px}.course-info h2{font-size:54px}.course-visual{min-height:260px;padding:14px;margin:0 10px 10px}.terminal-body{padding:17px 15px}.query{font-size:10px}.result-row{font-size:9px;grid-template-columns:34px 1fr 60px}.pipeline-window{padding:18px 12px}.flow{gap:8px}.flow-node{height:76px;font-size:8px}.flow-node b{font-size:10px}.js-demo-canvas{padding:20px 14px}.info-grid{grid-template-columns:1fr}.info-card{min-height:96px}.browser-canvas{min-height:360px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="app-header"><div class="header-inner"><button class="brand" id="brandBtn" aria-label="Kezdőlap"><span class="brand-mark">SM</span><span>SchoolMaterials</span></button><div class="header-actions"><button class="icon-btn menu-btn" id="menuBtn" aria-label="Tananyag menü"></button><button class="icon-btn" id="themeBtn" aria-label="Téma váltása"></button></div></div></header><div id="app"></div>
<script>
const modules=[{title:'Adatbázis-kezelés 1',lessons:['Adatbázis, tábla, rekord, mező és az SQL alapjai','SELECT, FROM és oszlopok lekérdezése','WHERE és összehasonlító feltételek','DISTINCT, ORDER BY, ASC és DESC','Több feltétel – AND, OR, NOT','NULL, IS NULL és IS NOT NULL','Adatmódosítás – INSERT, UPDATE, DELETE','Összesítés – COUNT, SUM, AVG, MIN, MAX','Csoportosítás – GROUP BY és HAVING','Rendezés, szűrés, csoportosítás és összesítés egy lekérdezésben','Adatbázis és tábla létrehozása','SQL adattípusok','Alapvető megszorítások – PRIMARY KEY, NOT NULL, UNIQUE','Egytáblás komplex gyakorlás','Egytáblás SQL számonkérés']},{title:'Adatbázis-kezelés 2',lessons:['Relációs adatbázisok felépítése','Elsődleges és idegen kulcsok','Táblák közötti kapcsolatok','Többtáblás adatbázis létrehozása','Adatbázis-tervezés','Redundanciamentes adatbázis-tervezés','Adatbázismodell-diagram készítése','Többtáblás lekérdezések alapjai','INNER JOIN','Külső JOIN-ok, elsősorban LEFT JOIN','Több tábla összekapcsolása egy lekérdezésben','JOIN + WHERE + ORDER BY','JOIN + összesítő függvények','JOIN + GROUP BY + HAVING','Összetett / haladó SQL-lekérdezések','Komplex többtáblás adatbázis-tervezési feladat','Adatbázis exportálása / dump készítése','Adatbázis használata backend alkalmazásból','Adatbázist használó REST API','ORM – objektum-relációs leképezés','Adatbázist kezelő konzolos / grafikus alkalmazás','Komplex webes + adatbázis-kezelési vizsgafeladat','Szakmai vizsga típusú adatbázis-feladatok']}];
const app=document.getElementById('app'),themeBtn=document.getElementById('themeBtn'),menuBtn=document.getElementById('menuBtn'),brandBtn=document.getElementById('brandBtn');const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.3 15.5A8.5 8.5 0 0 1 8.5 3.7 8.5 8.5 0 1 0 20.3 15.5Z"/></svg>',sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.6"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>',menuIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg>';menuBtn.innerHTML=menuIcon;let learningMounted=false;
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0e1114':'#f4f5f7';themeBtn.innerHTML=t==='dark'?sun:moon;localStorage.setItem('schoolmaterials-theme',t)}setTheme(localStorage.getItem('schoolmaterials-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');brandBtn.onclick=showHome;menuBtn.onclick=toggleSidebar;
function flatLessons(){return modules.flatMap((m,mi)=>m.lessons.map((title,li)=>({mi,li,title,module:m.title})))}function flatIndex(mi,li){return modules.slice(0,mi).reduce((n,m)=>n+m.lessons.length,0)+li}
function sidebarHtml(){return `<aside class="course-sidebar" id="sidebar"><div class="sidebar-head"><button class="sidebar-home" data-home>← Kezdőlap</button><h2>SQL</h2><p>Tananyagok</p></div><div class="accordion">${modules.map((m,mi)=>`<div><button class="module-toggle" data-module="${mi}"><span><small>Rész ${mi+1}</small><strong>${m.title}</strong></span><span class="chev">${arrow}</span></button><div class="module-lessons" data-lessons="${mi}">${m.lessons.map((l,li)=>`<button class="sidebar-lesson" data-mi="${mi}" data-li="${li}">${l}</button>`).join('')}</div></div>`).join('')}</div></aside><div class="backdrop" id="backdrop"></div>`}
function mountLearningShell(){if(learningMounted)return;app.innerHTML=`<div class="learning-shell">${sidebarHtml()}<main class="main-pane" id="mainPane"></main></div>`;learningMounted=true;bindSidebar()}function bindSidebar(){document.querySelector('[data-home]')?.addEventListener('click',showHome);document.querySelectorAll('[data-module]').forEach(btn=>btn.addEventListener('click',()=>{const mi=Number(btn.dataset.module),open=btn.classList.contains('expanded');setOpenModule(open?-1:mi)}));document.querySelectorAll('[data-mi]').forEach(btn=>btn.addEventListener('click',()=>{closeSidebar();showLesson(Number(btn.dataset.mi),Number(btn.dataset.li))}));document.getElementById('backdrop')?.addEventListener('click',closeSidebar)}function setOpenModule(openModule){document.querySelectorAll('[data-module]').forEach(btn=>btn.classList.toggle('expanded',Number(btn.dataset.module)===openModule));document.querySelectorAll('[data-lessons]').forEach(panel=>panel.classList.toggle('expanded',Number(panel.dataset.lessons)===openModule))}function updateSidebarState(mi,li){setOpenModule(mi);document.querySelectorAll('[data-module]').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.module)===mi));document.querySelectorAll('[data-mi]').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.mi)===mi&&Number(btn.dataset.li)===li))}function toggleSidebar(){document.getElementById('sidebar')?.classList.toggle('open');document.getElementById('backdrop')?.classList.toggle('open')}function closeSidebar(){document.getElementById('sidebar')?.classList.remove('open');document.getElementById('backdrop')?.classList.remove('open')}
function showHome(){closeSidebar();menuBtn.style.display='none';learningMounted=false;window.scrollTo(0,0);app.innerHTML=`<main class="home"><header class="home-head"><p class="home-label">SchoolMaterials</p><h1>Tananyagok</h1><p class="home-copy">Belső oktatási felület.</p></header><section class="course-stack">
<button class="course-card active-card" id="sqlCard" aria-label="SQL tananyag megnyitása"><div class="course-info"><div class="eyebrow"><span class="eyebrow-dot"></span>SQL tananyag</div><h2>SQL</h2><p>Adatbázis-kezelés, lekérdezések, relációs adatbázisok és a szakmai vizsgához szükséges témák.</p><div class="course-meta"><span>Adatbázis-kezelés 1</span><span>Adatbázis-kezelés 2</span></div><div class="course-cta">Megnyitás <i>${arrow}</i></div></div><div class="course-visual" aria-hidden="true"><div class="terminal"><div class="window-head"><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="window-title">query.sql</span></div><div class="terminal-body"><div class="query"><div class="query-line"><span class="kw">SELECT</span> id, nev, osztaly</div><div class="query-line"><span class="kw">FROM</span> tanulok</div><div class="query-line"><span class="kw">WHERE</span> atlag &gt; <span class="str">4.0</span><span class="cursor"></span></div></div><div class="result"><div class="result-head"><span>ID</span><span>NÉV</span><span>OSZTÁLY</span></div><div class="result-row"><span>01</span><span>Kiss Anna</span><span>10.A</span></div><div class="result-row"><span>07</span><span>Nagy Máté</span><span>10.B</span></div><div class="result-row"><span>12</span><span>Tóth Luca</span><span>11.A</span></div></div></div></div></div></button>
<article class="course-card js-card locked"><div class="course-info"><div class="eyebrow"><span class="eyebrow-dot"></span>JavaScript</div><h2>JavaScript</h2><p>Programozási alapok, DOM, események és aszinkron működés.</p><div class="course-meta"><span>Alapok</span><span>DOM</span><span>Aszinkron</span></div><div class="course-cta">Hamarosan <i>···</i></div></div><div class="course-visual" aria-hidden="true"><div class="js-demo-window"><div class="js-demo-head"><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="window-title">interakció</span></div><div class="js-demo-canvas"><div class="js-demo-title">Eseménykezelés élőben</div><div class="js-action-button"><span>Aktiválás</span></div><div class="js-output-panel"><div class="js-output-icon">✓</div><div class="js-output-copy"><strong>Esemény lefutott</strong><small>Az output azonnal frissült</small></div><div class="js-output-value">1</div></div></div></div></div></article>
<article class="course-card frontend-card locked"><div class="course-info"><div class="eyebrow"><span class="eyebrow-dot"></span>Frontend</div><h2>Frontend</h2><p>Kliensoldali webfejlesztés, felületek és modern frontend technológiák.</p><div class="course-meta"><span>HTML/CSS</span><span>React</span><span>Next.js</span></div><div class="course-cta">Hamarosan <i>···</i></div></div><div class="course-visual" aria-hidden="true"><div class="browser-window"><div class="browser-head"><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="window-title">dashboard</span></div><div class="browser-canvas"><div class="fe-toolbar"><span class="fe-logo"></span><span class="fe-chip"></span></div><div class="info-grid"><div class="info-card"><div class="info-skeleton"><i></i><i></i><i></i></div><div class="info-content"><div class="info-icon">A</div><div class="info-label">Osztály</div><div class="info-value">12.A</div><div class="info-line"></div></div></div><div class="info-card"><div class="info-skeleton"><i></i><i></i><i></i></div><div class="info-content"><div class="info-icon">Ø</div><div class="info-label">Átlag</div><div class="info-value">4,7</div><div class="info-line"></div></div></div><div class="info-card"><div class="info-skeleton"><i></i><i></i><i></i></div><div class="info-content"><div class="info-icon">%</div><div class="info-label">Jelenlét</div><div class="info-value">96%</div><div class="info-line"></div></div></div></div></div></div></div></article>
<article class="course-card backend-card locked"><div class="course-info"><div class="eyebrow"><span class="eyebrow-dot"></span>Backend</div><h2>Backend</h2><p>Szerveroldali fejlesztés, API-k, adatkezelés és alkalmazáslogika.</p><div class="course-meta"><span>Node.js</span><span>REST API</span><span>Adatbázis</span></div><div class="course-cta">Hamarosan <i>···</i></div></div><div class="course-visual" aria-hidden="true"><div class="pipeline-window"><div class="response">200 OK</div><div class="flow"><div class="flow-node"><span><b>Client</b>GET /api</span></div><div class="flow-node"><span><b>API</b>Express</span></div><div class="flow-node"><span><b>DB</b>SQL</span></div><span class="packet"></span></div></div></div></article>
</section></main>`;document.getElementById('sqlCard').onclick=()=>showLesson(0,0)}
function renderLessonContent(mi,li){const flat=flatLessons(),idx=flatIndex(mi,li),prev=flat[idx-1],next=flat[idx+1],title=modules[mi].lessons[li],pane=document.getElementById('mainPane');pane.innerHTML=`<article class="lesson"><div class="crumb"><button id="homeCrumb">Kezdőlap</button><span>/</span><span>SQL</span><span>/</span><span>${modules[mi].title}</span></div><p class="lesson-kicker">${modules[mi].title}</p><h1>${title}</h1><section class="material"><h2>Tananyag</h2><p>A részletes oktatási tartalom ide kerül.</p><div class="sample"><div class="sample-label">SQL példa</div><pre><code>SELECT *\nFROM tabla;</code></pre></div></section><nav class="pager"><button class="pager-btn" id="prev" ${prev?'':'disabled'}>${prev?'← '+prev.title:'← Előző'}</button><button class="pager-btn" id="next" ${next?'':'disabled'}>${next?next.title+' →':'Következő →'}</button></nav></article>`;document.getElementById('homeCrumb').onclick=showHome;if(prev)document.getElementById('prev').onclick=()=>showLesson(prev.mi,prev.li);if(next)document.getElementById('next').onclick=()=>showLesson(next.mi,next.li)}function showLesson(mi,li){menuBtn.style.display='';mountLearningShell();updateSidebarState(mi,li);renderLessonContent(mi,li);window.scrollTo({top:0,left:0,behavior:'auto'})}showHome();
</script>
</body></html>
