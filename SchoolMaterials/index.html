<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SchoolMaterials</title>
<style>
:root{--bg:#0d1117;--p:#131b24;--p2:#192430;--line:#25313d;--t:#f5f7fa;--m:#92a0af;--a:#24d0b1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#123028 0,transparent 28%),var(--bg);color:var(--t);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;color:inherit}.top{height:68px;position:sticky;top:0;z-index:5;display:flex;align-items:center;padding:0 26px;border-bottom:1px solid var(--line);background:#0d1117e8;backdrop-filter:blur(14px)}.brand{font-weight:850;font-size:18px;letter-spacing:-.4px;cursor:pointer}.brand b{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:10px;border-radius:10px;background:#24d0b11a;color:#86f2dc;border:1px solid #24d0b144}.layout{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 68px)}aside{position:sticky;top:68px;height:calc(100vh - 68px);padding:22px 14px;border-right:1px solid var(--line)}.cap{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:#607080;margin:4px 10px 10px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;padding:11px 12px;border-radius:11px;text-align:left;cursor:pointer;color:#b8c3ce}.nav button:hover,.nav .on{background:#24d0b112;color:#93f2df}.muted{opacity:.46}main{padding:44px clamp(20px,5vw,70px) 70px}.page{max-width:1200px;margin:auto}.eye{font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#7ff0da;margin-bottom:14px}h1{font-size:clamp(48px,7vw,88px);line-height:.95;letter-spacing:-4px;margin:0}.lead{max-width:720px;color:var(--m);font-size:18px;line-height:1.65;margin:22px 0 38px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.mod,.lessonHead,.box{border:1px solid var(--line);background:linear-gradient(180deg,#ffffff08,#ffffff03);border-radius:20px}.card{padding:22px;min-height:180px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#24d0b155}.card.off{opacity:.43;cursor:default}.card.off:hover{transform:none;border-color:var(--line)}.num{font-size:11px;color:#61707e}.card h3{font-size:23px;margin:42px 0 7px}.card p,.mod p,.box p{color:var(--m);line-height:1.55;margin:0}.tag{display:inline-block;margin-top:16px;padding:5px 8px;border:1px solid var(--line);border-radius:20px;font-size:11px;color:#7c8a98}.tag.live{color:#8df1de;border-color:#24d0b144}.sqlHero{padding:44px;border:1px solid #24d0b144;border-radius:26px;background:#24d0b109;margin-bottom:22px}.sqlHero h1{font-size:72px}.mods{display:grid;grid-template-columns:1fr 1fr;gap:18px}.mod{overflow:hidden}.modHead{padding:22px;border-bottom:1px solid var(--line)}.modHead small{color:#80eed9;font-weight:800}.mod h2{margin:8px 0 6px;font-size:25px}.list{padding:9px}.row{display:grid;grid-template-columns:34px 1fr 20px;gap:6px;align-items:center;padding:10px;border-radius:10px;cursor:pointer}.row:hover{background:#ffffff08}.row span{color:#617080;font-size:11px}.row strong{font-size:13px;line-height:1.3}.crumb{color:#718091;font-size:12px;margin-bottom:18px}.crumb button{border:0;background:none;padding:0;color:#91a1b0;cursor:pointer}.lessonHead{padding:38px;margin-bottom:16px}.lessonHead h1{font-size:clamp(36px,5vw,64px);letter-spacing:-2.8px;line-height:1.03}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.pill{font-size:11px;padding:6px 9px;border:1px solid var(--line);border-radius:20px;color:#91a0ae}.pill.a{color:#8cf0dc;border-color:#24d0b144}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:22px}.step{padding:14px;border-radius:13px;background:var(--p2);border:1px solid var(--line)}.step b{display:block;margin-bottom:4px}.step small{color:#748394;line-height:1.4}.stage{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}.box{padding:21px}.box h3{margin:0 0 8px}.lines{display:grid;gap:9px;margin-top:20px}.lines i{height:9px;border-radius:10px;background:#ffffff09}.lines i:nth-child(2){width:80%}.lines i:nth-child(3){width:91%}pre{margin:15px 0 0;padding:18px;border-radius:14px;background:#080c10;border:1px solid var(--line);color:#bcd0dc;overflow:auto}pre b{color:#82efd9}.foot{display:flex;justify-content:space-between;margin-top:16px}.btn{border:1px solid var(--line);background:var(--p);padding:10px 13px;border-radius:11px;cursor:pointer}.btn.next{background:var(--a);color:#06251e;border:0;font-weight:800}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.mods,.stage{grid-template-columns:1fr}}@media(max-width:720px){.layout{display:block}aside{display:none}main{padding:28px 16px 50px}.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.sqlHero{padding:28px}.sqlHero h1{font-size:58px}}
</style></head><body><div id="app"></div>
<script>
const M=[{id:"db1",name:"Adatbázis-kezelés 1",sub:"SQL alapok és egytáblás adatkezelés",l:["Adatbázis, tábla, rekord, mező és az SQL alapjai", "SELECT, FROM és oszlopok lekérdezése", "WHERE és összehasonlító feltételek", "DISTINCT, ORDER BY, ASC és DESC", "Több feltétel – AND, OR, NOT", "NULL, IS NULL és IS NOT NULL", "Adatmódosítás – INSERT, UPDATE, DELETE", "Összesítés – COUNT, SUM, AVG, MIN, MAX", "Csoportosítás – GROUP BY és HAVING", "Rendezés, szűrés, csoportosítás és összesítés egy lekérdezésben", "Adatbázis és tábla létrehozása", "SQL adattípusok", "Alapvető megszorítások – PRIMARY KEY, NOT NULL, UNIQUE", "Egytáblás komplex gyakorlás", "Egytáblás SQL számonkérés"]},{id:"db2",name:"Adatbázis-kezelés 2",sub:"Relációs adatbázisok és komplex adatbázis-kezelés",l:["Relációs adatbázisok felépítése", "Elsődleges és idegen kulcsok", "Táblák közötti kapcsolatok", "Többtáblás adatbázis létrehozása", "Adatbázis-tervezés", "Redundanciamentes adatbázis-tervezés", "Adatbázismodell-diagram készítése", "Többtáblás lekérdezések alapjai", "INNER JOIN", "Külső JOIN-ok – elsősorban LEFT JOIN", "Több tábla összekapcsolása egy lekérdezésben", "JOIN + WHERE + ORDER BY", "JOIN + összesítő függvények", "JOIN + GROUP BY + HAVING", "Összetett és haladó SQL-lekérdezések", "Komplex többtáblás adatbázis-tervezési feladat", "Adatbázis exportálása és dump készítése", "Adatbázis használata backend alkalmazásból", "Adatbázist használó REST API", "ORM – objektum-relációs leképezés", "Adatbázist kezelő konzolos vagy grafikus alkalmazás", "Komplex webes és adatbázis-kezelési vizsgafeladat", "Szakmai vizsga típusú adatbázis-feladatok"]}];
const A=document.querySelector("#app");function go(x){location.hash=x}function route(){let p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);return p[0]=="sql"&&p[1]=="lesson"?{p:"lesson",m:p[2],n:+p[3]}:{p:p[0]||"home"}}
function shell(c,a){return `<header class="top"><div class="brand" onclick="go('/')"><b>S</b>SchoolMaterials</div></header><div class="layout"><aside><div class="cap">Tananyagok</div><div class="nav"><button class="${a=="home"?"on":""}" onclick="go('/')">Kezdőlap</button><button class="muted">Gyakorló · hamarosan</button><button class="muted">JS · hamarosan</button><button class="${a=="sql"?"on":""}" onclick="go('/sql')">SQL · 38 lecke</button><button class="muted">Matek · hamarosan</button></div></aside><main>${c}</main></div>`}
function home(){let d=[["Bevezető","Alapozó anyagok és indulási útmutatók."],["Gyakorló","Feladatsorok és célzott gyakorlás."],["JS","JavaScript és webes programozás."],["SQL","Adatbázis-kezelés az alapoktól a szakmai vizsgáig."],["Matek","Matematikai segédanyagok."]];A.innerHTML=shell(`<div class="page"><section><div class="eye">Oktatási platform diákoknak</div><h1>SchoolMaterials</h1><p class="lead">Modern, átlátható tanulási felület. Elsőként az SQL teljes tananyagstruktúrája érhető el.</p></section><div class="grid">${d.map((x,i)=>`<article class="card ${i==3?"":"off"}" ${i==3?`onclick="go('/sql')"`:""}><span class="num">0${i+1} / 05</span><h3>${x[0]}</h3><p>${x[1]}</p><span class="tag ${i==3?"live":""}">${i==3?"Elérhető":"Hamarosan"}</span></article>`).join("")}</div></div>`,"home")}
function mod(x,i){return `<section class="mod"><div class="modHead"><small>MODUL ${i+1}</small><h2>${x.name}</h2><p>${x.sub}</p></div><div class="list">${x.l.map((t,j)=>`<div class="row" onclick="go('/sql/lesson/${x.id}/${j+1}')"><span>${String(j+1).padStart(2,"0")}</span><strong>${t}</strong><span>›</span></div>`).join("")}</div></section>`}
function sql(){A.innerHTML=shell(`<div class="page"><section class="sqlHero"><div class="eye">Aktív tananyag</div><h1>SQL</h1><p class="lead" style="margin-bottom:0">Két egymásra épülő modul az egytáblás alapoktól a relációs adatbázisokon át a szakmai vizsgáig.</p></section><div class="mods">${M.map(mod).join("")}</div></div>`,"sql")}
function lesson(r){let m=M.find(x=>x.id==r.m),i=r.n-1,t=m?.l[i];if(!t)return sql();let prev=i?i:null,next=i<m.l.length-1?i+2:null;A.innerHTML=shell(`<div class="page"><div class="crumb"><button onclick="go('/sql')">SQL</button> › ${m.name}</div><section class="lessonHead"><div class="pills"><span class="pill a">${m.name}</span><span class="pill">${String(i+1).padStart(2,"0")} / ${m.l.length}</span><span class="pill">Tananyagváz</span></div><h1>${t}</h1><p class="lead" style="font-size:15px;margin-bottom:0">Ez a végleges tananyag-megjelenítő keret: a lecke itt kap majd magyarázatot, példákat és gyakorlófeladatokat.</p><div class="steps"><div class="step"><b>01 · Értsd meg</b><small>Rövid, világos elmélet.</small></div><div class="step"><b>02 · Nézd meg</b><small>Lépésről lépésre SQL-példa.</small></div><div class="step"><b>03 · Próbáld ki</b><small>Önálló gyakorlófeladat.</small></div></div></section><div class="stage"><section class="box"><h3>Tananyag</h3><p>Itt jelenik majd meg a részletes lecke.</p><div class="lines"><i></i><i></i><i></i></div></section><section class="box"><h3>SQL példa</h3><p>Egységes, jól olvasható kódblokk.</p><pre>-- ${t}\n<b>SELECT</b> *\n<b>FROM</b> pelda_tabla\n<b>WHERE</b> feltetel = '...';</pre></section></div><div class="foot">${prev?`<button class="btn" onclick="go('/sql/lesson/${m.id}/${prev}')">← Előző</button>`:`<button class="btn" onclick="go('/sql')">← Áttekintés</button>`}${next?`<button class="btn next" onclick="go('/sql/lesson/${m.id}/${next}')">Következő →</button>`:`<button class="btn next" onclick="go('/sql')">Modul kész →</button>`}</div></div>`,"sql")}
function render(){let r=route();r.p=="sql"?sql():r.p=="lesson"?lesson(r):home()}addEventListener("hashchange",render);render();
</script></body></html>
