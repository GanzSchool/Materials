<!doctype html>
<html lang="hu" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7f9" />
  <title>SchoolMaterials</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #f0f2f5;
      --text: #15181d;
      --muted: #69717d;
      --line: #dfe3e8;
      --accent: #0d7c66;
      --accent-strong: #075f4e;
      --accent-soft: #e5f5f1;
      --code: #111820;
      --code-text: #dce7ee;
      --shadow: 0 10px 30px rgba(18, 25, 33, .06);
      --radius: 18px;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f1216;
      --surface: #15191e;
      --surface-2: #1b2026;
      --text: #f2f4f7;
      --muted: #9da6b2;
      --line: #2a3038;
      --accent: #4ccfb2;
      --accent-strong: #7fe1ca;
      --accent-soft: #17352e;
      --code: #090c10;
      --code-text: #dce7ee;
      --shadow: 0 16px 40px rgba(0, 0, 0, .22);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    a { color: inherit; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 68px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .header-inner {
      width: min(1280px, calc(100% - 40px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand {
      border: 0;
      background: transparent;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--text);
      cursor: pointer;
      font-weight: 760;
      font-size: 18px;
      letter-spacing: -.35px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--text);
      color: var(--surface);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: -.2px;
    }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease;
    }
    .icon-btn:hover { background: var(--surface-2); }
    .icon-btn svg { width: 18px; height: 18px; }

    .shell {
      width: min(1280px, calc(100% - 40px));
      margin: 0 auto;
      min-height: calc(100vh - 68px);
    }

    .home { padding: 64px 0 80px; }
    .home-section { max-width: 980px; margin: 0 auto; }
    .section-kicker {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    .section-title {
      margin: 0;
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1.06;
      letter-spacing: -1.8px;
    }
    .section-copy {
      margin: 14px 0 30px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
      max-width: 650px;
    }
    .course-card {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 22px;
      padding: clamp(24px, 4vw, 38px);
      box-shadow: var(--shadow);
      cursor: pointer;
      text-align: left;
      color: var(--text);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 28px;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .course-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
      box-shadow: 0 18px 40px rgba(18, 25, 33, .09);
    }
    .course-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 780;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .course-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .course-card h2 {
      margin: 0 0 9px;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1;
      letter-spacing: -1.7px;
    }
    .course-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      max-width: 650px;
    }
    .course-open {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      flex: none;
    }
    [data-theme="dark"] .course-open { color: #09251e; }
    .course-open svg { width: 20px; height: 20px; }

    .course-page { padding: 38px 0 72px; }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 30px;
    }
    .breadcrumb button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 0;
      cursor: pointer;
    }
    .breadcrumb button:hover { color: var(--text); }
    .course-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      padding-bottom: 30px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 26px;
    }
    .course-header h1 {
      margin: 0 0 10px;
      font-size: clamp(42px, 7vw, 72px);
      line-height: .98;
      letter-spacing: -2.5px;
    }
    .course-header p { margin: 0; max-width: 720px; color: var(--muted); line-height: 1.6; }
    .course-badge {
      padding: 8px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }
    .modules { display: grid; gap: 18px; }
    .module {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .module-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      padding: 22px 24px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-2) 48%, var(--surface));
    }
    .module-head h2 { margin: 0 0 5px; font-size: 21px; letter-spacing: -.55px; }
    .module-head p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .module-count { color: var(--muted); font-size: 12px; white-space: nowrap; margin-top: 3px; }
    .lesson-list { padding: 8px; }
    .lesson-row {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 10px;
      padding: 12px 13px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      transition: background .15s ease;
    }
    .lesson-row:hover { background: var(--surface-2); }
    .lesson-index {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
    }
    .lesson-name { font-size: 14px; font-weight: 630; line-height: 1.35; }
    .lesson-arrow { color: var(--muted); display: grid; place-items: center; }
    .lesson-arrow svg { width: 17px; height: 17px; }

    .lesson-page {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 0;
      min-height: calc(100vh - 68px);
    }
    .lesson-sidebar {
      position: sticky;
      top: 68px;
      height: calc(100vh - 68px);
      overflow: auto;
      border-right: 1px solid var(--line);
      padding: 24px 18px 40px 0;
    }
    .sidebar-back {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 4px 0 18px;
      cursor: pointer;
      font-size: 13px;
    }
    .sidebar-back:hover { color: var(--text); }
    .sidebar-title { margin: 0 0 4px; font-size: 18px; }
    .sidebar-subtitle { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
    .sidebar-group-title {
      margin: 22px 0 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .sidebar-lesson {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--muted);
      text-align: left;
      padding: 9px 10px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.35;
    }
    .sidebar-lesson:hover { background: var(--surface-2); color: var(--text); }
    .sidebar-lesson.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; }
    .lesson-content-wrap { padding: 42px clamp(28px, 6vw, 76px) 72px; }
    .lesson-content { max-width: 820px; margin: 0 auto; }
    .lesson-mobile-bar { display: none; }
    .lesson-meta {
      margin-bottom: 14px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .lesson-content h1 {
      margin: 0 0 34px;
      font-size: clamp(36px, 5.8vw, 60px);
      line-height: 1.06;
      letter-spacing: -2px;
    }
    .material-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: clamp(22px, 4vw, 34px);
    }
    .material-card h2 { margin: 0 0 8px; font-size: 19px; }
    .material-card p { margin: 0; color: var(--muted); line-height: 1.7; }
    .sample-block { margin-top: 24px; }
    .sample-label { margin-bottom: 8px; color: var(--muted); font-size: 12px; font-weight: 700; }
    pre {
      margin: 0;
      background: var(--code);
      color: var(--code-text);
      border-radius: 13px;
      padding: 18px;
      overflow-x: auto;
      font: 13px/1.6 "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    .lesson-nav {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 20px;
    }
    .nav-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 14px;
      cursor: pointer;
      font-weight: 650;
      font-size: 13px;
    }
    .nav-btn:hover { background: var(--surface-2); }
    .nav-btn:disabled { opacity: .35; cursor: default; }

    @media (max-width: 860px) {
      .header-inner, .shell { width: min(100% - 28px, 1280px); }
      .home { padding-top: 42px; }
      .course-card { grid-template-columns: 1fr auto; }
      .lesson-page { display: block; }
      .lesson-sidebar { display: none; }
      .lesson-content-wrap { padding: 24px 0 56px; }
      .lesson-mobile-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 24px;
      }
      .lesson-mobile-bar button {
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        padding: 9px 11px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 650;
      }
      .lesson-select {
        min-width: 0;
        max-width: 58%;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--text);
        border-radius: 10px;
        padding: 9px 10px;
        font: inherit;
        font-size: 12px;
      }
    }

    @media (max-width: 620px) {
      .app-header { height: 62px; }
      .brand { font-size: 16px; }
      .brand-mark { width: 31px; height: 31px; }
      .header-inner, .shell { width: min(100% - 24px, 1280px); }
      .home { padding: 34px 0 48px; }
      .section-copy { margin-bottom: 22px; }
      .course-card { grid-template-columns: 1fr; gap: 22px; padding: 24px; }
      .course-label { margin-bottom: 20px; }
      .course-open { width: 44px; height: 44px; }
      .course-page { padding-top: 28px; }
      .course-header { grid-template-columns: 1fr; align-items: start; }
      .module-head { padding: 18px; }
      .module-count { display: none; }
      .lesson-list { padding: 6px; }
      .lesson-row { grid-template-columns: 36px minmax(0,1fr) 22px; gap: 8px; padding: 10px 8px; }
      .lesson-index { width: 30px; height: 30px; }
      .lesson-name { font-size: 13px; }
      .lesson-content h1 { margin-bottom: 24px; }
      .material-card { padding: 20px; }
      .lesson-nav { flex-direction: column; }
      .lesson-nav .nav-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="brand" id="brandBtn" aria-label="Kezdőlap">
        <span class="brand-mark">SM</span>
        <span>SchoolMaterials</span>
      </button>
      <div class="header-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Téma váltása" title="Téma váltása"></button>
      </div>
    </div>
  </header>

  <div class="shell" id="app"></div>

  <script>
    const modules = [
      {
        title: 'Adatbázis-kezelés 1',
        description: 'SQL alapok és egytáblás adatkezelés',
        lessons: [
          'Adatbázis, tábla, rekord, mező és az SQL alapjai',
          'SELECT, FROM és oszlopok lekérdezése',
          'WHERE és összehasonlító feltételek',
          'DISTINCT, ORDER BY, ASC és DESC',
          'Több feltétel – AND, OR, NOT',
          'NULL, IS NULL és IS NOT NULL',
          'Adatmódosítás – INSERT, UPDATE, DELETE',
          'Összesítés – COUNT, SUM, AVG, MIN, MAX',
          'Csoportosítás – GROUP BY és HAVING',
          'Rendezés, szűrés, csoportosítás és összesítés egy lekérdezésben',
          'Adatbázis és tábla létrehozása',
          'SQL adattípusok',
          'Alapvető megszorítások – PRIMARY KEY, NOT NULL, UNIQUE',
          'Egytáblás komplex gyakorlás',
          'Egytáblás SQL számonkérés'
        ]
      },
      {
        title: 'Adatbázis-kezelés 2',
        description: 'Relációs adatbázisok és komplex adatbázis-kezelés',
        lessons: [
          'Relációs adatbázisok felépítése',
          'Elsődleges és idegen kulcsok',
          'Táblák közötti kapcsolatok',
          'Többtáblás adatbázis létrehozása',
          'Adatbázis-tervezés',
          'Redundanciamentes adatbázis-tervezés',
          'Adatbázismodell-diagram készítése',
          'Többtáblás lekérdezések alapjai',
          'INNER JOIN',
          'Külső JOIN-ok, elsősorban LEFT JOIN',
          'Több tábla összekapcsolása egy lekérdezésben',
          'JOIN + WHERE + ORDER BY',
          'JOIN + összesítő függvények',
          'JOIN + GROUP BY + HAVING',
          'Összetett / haladó SQL-lekérdezések',
          'Komplex többtáblás adatbázis-tervezési feladat',
          'Adatbázis exportálása / dump készítése',
          'Adatbázis használata backend alkalmazásból',
          'Adatbázist használó REST API',
          'ORM – objektum-relációs leképezés',
          'Adatbázist kezelő konzolos / grafikus alkalmazás',
          'Komplex webes + adatbázis-kezelési vizsgafeladat',
          'Szakmai vizsga típusú adatbázis-feladatok'
        ]
      }
    ];

    const app = document.getElementById('app');
    const themeBtn = document.getElementById('themeBtn');
    const brandBtn = document.getElementById('brandBtn');

    const sunIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.6"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>';
    const moonIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.3 15.5A8.5 8.5 0 0 1 8.5 3.7 8.5 8.5 0 1 0 20.3 15.5Z"/></svg>';
    const arrowIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg>';

    const savedTheme = localStorage.getItem('schoolmaterials-theme');
    const preferredDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(savedTheme || (preferredDark ? 'dark' : 'light'));

    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0f1216' : '#f6f7f9');
      themeBtn.innerHTML = theme === 'dark' ? sunIcon : moonIcon;
      themeBtn.title = theme === 'dark' ? 'Világos téma' : 'Sötét téma';
      localStorage.setItem('schoolmaterials-theme', theme);
    }

    themeBtn.addEventListener('click', () => {
      setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    brandBtn.addEventListener('click', showHome);

    function showHome() {
      window.scrollTo(0, 0);
      app.innerHTML = `
        <main class="home">
          <section class="home-section">
            <p class="section-kicker">Tananyagok</p>
            <h1 class="section-title">SchoolMaterials</h1>
            <p class="section-copy">Belső oktatási felület a tanórai és gyakorló anyagokhoz.</p>
            <button class="course-card" id="sqlCard">
              <div>
                <div class="course-label"><span class="course-dot"></span>Elérhető tananyag</div>
                <h2>SQL</h2>
                <p>Adatbázis-kezelés, lekérdezések, relációs adatbázisok és a szakmai vizsgához szükséges témák.</p>
              </div>
              <span class="course-open" aria-hidden="true">${arrowIcon}</span>
            </button>
          </section>
        </main>`;
      document.getElementById('sqlCard').addEventListener('click', showCourse);
    }

    function showCourse() {
      window.scrollTo(0, 0);
      const moduleHtml = modules.map((module, mIndex) => `
        <section class="module">
          <div class="module-head">
            <div>
              <h2>${module.title}</h2>
              <p>${module.description}</p>
            </div>
            <span class="module-count">${module.lessons.length} lecke</span>
          </div>
          <div class="lesson-list">
            ${module.lessons.map((lesson, lIndex) => `
              <button class="lesson-row" data-module="${mIndex}" data-lesson="${lIndex}">
                <span class="lesson-index">${String(lIndex + 1).padStart(2, '0')}</span>
                <span class="lesson-name">${lesson}</span>
                <span class="lesson-arrow">${arrowIcon}</span>
              </button>`).join('')}
          </div>
        </section>`).join('');

      app.innerHTML = `
        <main class="course-page">
          <div class="breadcrumb"><button id="homeCrumb">Kezdőlap</button><span>/</span><span>SQL</span></div>
          <header class="course-header">
            <div>
              <h1>SQL</h1>
              <p>Az SQL tananyag két egymásra épülő részben vezeti végig az adatbázis-kezelés alapjaitól a relációs adatbázisokon és összetett lekérdezéseken át az alkalmazásból történő adatkezelésig.</p>
            </div>
            <span class="course-badge">Oktatási anyag</span>
          </header>
          <div class="modules">${moduleHtml}</div>
        </main>`;

      document.getElementById('homeCrumb').addEventListener('click', showHome);
      app.querySelectorAll('.lesson-row').forEach(btn => {
        btn.addEventListener('click', () => showLesson(Number(btn.dataset.module), Number(btn.dataset.lesson)));
      });
    }

    function lessonFlatIndex(moduleIndex, lessonIndex) {
      return modules.slice(0, moduleIndex).reduce((sum, m) => sum + m.lessons.length, 0) + lessonIndex;
    }

    function allLessons() {
      return modules.flatMap((module, moduleIndex) => module.lessons.map((title, lessonIndex) => ({ moduleIndex, lessonIndex, title, moduleTitle: module.title })));
    }

    function showLesson(moduleIndex, lessonIndex) {
      window.scrollTo(0, 0);
      const module = modules[moduleIndex];
      const title = module.lessons[lessonIndex];
      const flat = allLessons();
      const current = lessonFlatIndex(moduleIndex, lessonIndex);
      const prev = flat[current - 1];
      const next = flat[current + 1];

      const sidebar = modules.map((m, mi) => `
        <div class="sidebar-group-title">${m.title}</div>
        ${m.lessons.map((lesson, li) => `
          <button class="sidebar-lesson ${mi === moduleIndex && li === lessonIndex ? 'active' : ''}" data-module="${mi}" data-lesson="${li}">${lesson}</button>
        `).join('')}
      `).join('');

      const optionHtml = flat.map((item, index) => `<option value="${index}" ${index === current ? 'selected' : ''}>${item.moduleTitle} · ${item.title}</option>`).join('');

      app.innerHTML = `
        <main class="lesson-page">
          <aside class="lesson-sidebar">
            <button class="sidebar-back" id="courseBack">← Vissza az SQL-hez</button>
            <h2 class="sidebar-title">SQL</h2>
            <p class="sidebar-subtitle">Kurzus tartalom</p>
            ${sidebar}
          </aside>
          <div class="lesson-content-wrap">
            <article class="lesson-content">
              <div class="lesson-mobile-bar">
                <button id="mobileCourseBack">← SQL</button>
                <select class="lesson-select" id="lessonSelect" aria-label="Lecke választása">${optionHtml}</select>
              </div>
              <div class="lesson-meta">${module.title}</div>
              <h1>${title}</h1>
              <section class="material-card">
                <h2>Tananyag</h2>
                <p>A részletes oktatási tartalom ide kerül.</p>
                <div class="sample-block">
                  <div class="sample-label">SQL példa</div>
                  <pre><code>SELECT *
FROM tabla;</code></pre>
                </div>
              </section>
              <nav class="lesson-nav">
                <button class="nav-btn" id="prevBtn" ${prev ? '' : 'disabled'}>${prev ? '← ' + prev.title : '← Előző'}</button>
                <button class="nav-btn" id="nextBtn" ${next ? '' : 'disabled'}>${next ? next.title + ' →' : 'Következő →'}</button>
              </nav>
            </article>
          </div>
        </main>`;

      document.getElementById('courseBack').addEventListener('click', showCourse);
      document.getElementById('mobileCourseBack').addEventListener('click', showCourse);
      app.querySelectorAll('.sidebar-lesson').forEach(btn => {
        btn.addEventListener('click', () => showLesson(Number(btn.dataset.module), Number(btn.dataset.lesson)));
      });
      document.getElementById('lessonSelect').addEventListener('change', e => {
        const item = flat[Number(e.target.value)];
        showLesson(item.moduleIndex, item.lessonIndex);
      });
      if (prev) document.getElementById('prevBtn').addEventListener('click', () => showLesson(prev.moduleIndex, prev.lessonIndex));
      if (next) document.getElementById('nextBtn').addEventListener('click', () => showLesson(next.moduleIndex, next.lessonIndex));
    }

    showHome();
  </script>
</body>
</html>
