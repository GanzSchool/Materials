<!doctype html>
<html lang="hu" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f5f7" />
  <title>SchoolMaterials</title>
  <style>
    :root{
      color-scheme:light;
      --bg:#f4f5f7;
      --surface:#ffffff;
      --surface-2:#eef1f3;
      --surface-3:#e8ecef;
      --text:#17191d;
      --muted:#66707b;
      --line:#dde2e6;
      --accent:#087a67;
      --accent-soft:#e4f4ef;
      --accent-text:#056453;
      --code:#10171f;
      --code-text:#dbe7ee;
      --visual-bg:#e5eeeb;
      --visual-bg-2:#dce8e4;
      --visual-line:#c8d8d3;
      --terminal:#1a2933;
      --terminal-head:#21323d;
      --terminal-line:#3a4a55;
      --terminal-muted:#8fa0ac;
      --shadow:0 18px 48px rgba(28,36,44,.08);
      --header:62px;
      --sidebar:288px;
    }
    [data-theme="dark"]{
      color-scheme:dark;
      --bg:#0e1114;
      --surface:#15191d;
      --surface-2:#1c2126;
      --surface-3:#252b31;
      --text:#f2f4f5;
      --muted:#9aa4ae;
      --line:#2a3036;
      --accent:#52cdb3;
      --accent-soft:#17362f;
      --accent-text:#7de0ca;
      --code:#111a21;
      --code-text:#dbe7ee;
      --visual-bg:#1d292a;
      --visual-bg-2:#223130;
      --visual-line:#31413f;
      --terminal:#1b2831;
      --terminal-head:#22333d;
      --terminal-line:#40505a;
      --terminal-muted:#93a4af;
      --shadow:0 20px 56px rgba(0,0,0,.25)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-width:320px;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    body{transition:background-color .22s ease,color .22s ease}
    button{font:inherit;color:inherit}
    button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

    .app-header{height:var(--header);position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--surface) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
    .header-inner{height:100%;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;cursor:pointer;font-weight:760;font-size:17px;letter-spacing:-.35px}
    .brand-mark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--text);color:var(--surface);font-size:10px;font-weight:850;transition:transform .2s ease}
    .brand:hover .brand-mark{transform:rotate(-4deg) scale(1.04)}
    .header-actions{display:flex;gap:8px;align-items:center}
    .icon-btn{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:transform .16s ease,background .16s ease,border-color .16s ease}
    .icon-btn:hover{background:var(--surface-2);transform:translateY(-1px)}
    .icon-btn svg{width:17px;height:17px}
    .menu-btn{display:none}

    /* Kezdőlap */
    .home{width:min(1160px,calc(100% - 40px));margin:0 auto;padding:58px 0 72px}
    .home-head{margin-bottom:24px;animation:fadeUp .45s ease both}
    .home-label{margin:0 0 7px;color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}
    .home h1{margin:0;font-size:clamp(34px,5vw,52px);line-height:1.04;letter-spacing:-1.9px}
    .home-copy{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.6}

    .sql-card{position:relative;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,.92fr) minmax(380px,1.08fr);gap:0;text-align:left;cursor:pointer;animation:fadeUp .52s .05s ease both;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}
    .sql-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 48%,var(--line));box-shadow:0 24px 64px rgba(28,36,44,.11)}
    [data-theme="dark"] .sql-card:hover{box-shadow:0 24px 64px rgba(0,0,0,.34)}
    .sql-info{padding:clamp(28px,4.8vw,58px);display:flex;flex-direction:column;justify-content:center;min-height:390px}
    .eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:38px;color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.11em}
    .eyebrow-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 12%,transparent)}
    .sql-info h2{margin:0 0 10px;font-size:clamp(52px,7vw,82px);letter-spacing:-3.5px;line-height:.93}
    .sql-info p{margin:0;max-width:520px;color:var(--muted);font-size:15px;line-height:1.65}
    .sql-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
    .sql-meta span{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:11px;font-weight:650}
    .course-cta{display:inline-flex;align-items:center;gap:9px;margin-top:34px;color:var(--text);font-size:13px;font-weight:750}
    .course-cta i{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:white;font-style:normal;transition:transform .2s ease}
    [data-theme="dark"] .course-cta i{color:#08251f}
    .sql-card:hover .course-cta i{transform:translateX(5px)}
    .course-cta svg{width:16px;height:16px}

    .sql-visual{position:relative;min-height:362px;margin:14px 14px 14px 0;border:1px solid var(--visual-line);border-radius:19px;background:linear-gradient(145deg,var(--visual-bg),var(--visual-bg-2));display:grid;place-items:center;padding:34px;overflow:hidden}
    .sql-visual::before{content:"";position:absolute;inset:0;background-image:linear-gradient(color-mix(in srgb,var(--accent) 10%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 10%,transparent) 1px,transparent 1px);background-size:30px 30px;opacity:.65;mask-image:linear-gradient(to bottom,black,transparent 96%)}
    .sql-visual::after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;right:-80px;bottom:-110px;background:color-mix(in srgb,var(--accent) 10%,transparent);filter:blur(10px)}
    .terminal{position:relative;z-index:2;width:min(500px,100%);border:1px solid var(--terminal-line);border-radius:16px;background:var(--terminal);box-shadow:0 22px 50px rgba(20,32,40,.22);overflow:hidden}
    [data-theme="dark"] .terminal{box-shadow:0 22px 55px rgba(0,0,0,.3)}
    .terminal-head{height:42px;border-bottom:1px solid var(--terminal-line);background:var(--terminal-head);display:flex;align-items:center;gap:7px;padding:0 14px;color:var(--terminal-muted);font-size:10px}
    .terminal-dot{width:7px;height:7px;border-radius:50%;background:#60717d}
    .terminal-title{margin-left:6px;letter-spacing:.04em}
    .terminal-body{padding:22px 22px 20px}
    .query{font:12px/1.72 "SFMono-Regular",Consolas,"Liberation Mono",monospace;color:#d7e0e6}
    .query-line{opacity:0;transform:translateY(4px);animation:codeLine .34s ease forwards}
    .query-line:nth-child(1){animation-delay:.2s}.query-line:nth-child(2){animation-delay:.48s}.query-line:nth-child(3){animation-delay:.76s}
    .kw{color:#78dfc8}.str{color:#f0cd8e}.col{color:#a9c8df}
    .cursor{display:inline-block;width:7px;height:15px;margin-left:2px;background:#78dfc8;vertical-align:-2px;animation:blink .9s .85s steps(1) infinite}
    .result{margin-top:20px;border-top:1px solid var(--terminal-line);padding-top:16px;opacity:0;animation:resultIn .32s 1.05s ease forwards}
    .result-head,.result-row{display:grid;grid-template-columns:48px 1fr 76px;gap:12px;align-items:center}
    .result-head{color:#81919d;font:9px/1.3 "SFMono-Regular",Consolas,monospace;text-transform:uppercase;letter-spacing:.08em;padding:0 8px 8px}
    .result-row{min-height:34px;padding:0 8px;border-top:1px solid color-mix(in srgb,var(--terminal-line) 68%,transparent);color:#c1cbd2;font:10px/1.3 "SFMono-Regular",Consolas,monospace;opacity:0;animation:rowIn .32s ease forwards}
    .result-row:nth-child(2){animation-delay:1.25s}.result-row:nth-child(3){animation-delay:1.42s}.result-row:nth-child(4){animation-delay:1.59s}

    .upcoming-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
    .upcoming-card{position:relative;min-height:164px;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:22px;overflow:hidden;animation:fadeUp .48s ease both;cursor:default}
    .upcoming-card:nth-child(1){animation-delay:.12s}.upcoming-card:nth-child(2){animation-delay:.18s}.upcoming-card:nth-child(3){animation-delay:.24s}
    .upcoming-card::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-52px;bottom:-58px;background:color-mix(in srgb,var(--accent) 7%,transparent)}
    .upcoming-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:34px}
    .upcoming-code{display:inline-grid;place-items:center;min-width:34px;height:30px;padding:0 8px;border-radius:9px;background:var(--surface-2);color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.04em}
    .upcoming-state{font-size:10px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .upcoming-card h3{position:relative;z-index:1;margin:0 0 6px;font-size:24px;letter-spacing:-.7px}
    .upcoming-card p{position:relative;z-index:1;margin:0;color:var(--muted);font-size:12px;line-height:1.5}

    /* Belső SQL nézet */
    .learning-shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:calc(100vh - var(--header))}
    .course-sidebar{position:sticky;top:var(--header);width:var(--sidebar);height:calc(100vh - var(--header));overflow-y:scroll;scrollbar-gutter:stable;background:var(--surface);border-right:1px solid var(--line);padding:20px 12px 28px}
    .sidebar-head{padding:0 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
    .sidebar-home{border:0;background:none;padding:3px 0 14px;color:var(--muted);font-size:12px;cursor:pointer;transition:color .15s ease,transform .15s ease}
    .sidebar-home:hover{color:var(--text);transform:translateX(2px)}
    .sidebar-head h2{margin:0;font-size:22px;letter-spacing:-.6px}
    .sidebar-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .accordion{display:grid;gap:7px}
    .module-toggle{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 18px;align-items:center;gap:8px;border:0;border-radius:10px;background:transparent;padding:11px 10px;text-align:left;cursor:pointer;transition:background .17s ease}
    .module-toggle:hover{background:var(--surface-2)}
    .module-toggle.active,.module-toggle.expanded{background:var(--accent-soft)}
    .module-toggle small{display:block;margin-bottom:3px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .module-toggle strong{display:block;font-size:13px;line-height:1.3}
    .module-toggle.active strong,.module-toggle.expanded strong{color:var(--accent-text)}
    .chev{display:grid;place-items:center;color:var(--muted);transition:transform .22s ease}
    .module-toggle.expanded .chev{transform:rotate(90deg)}
    .chev svg{width:15px;height:15px}
    .module-lessons{display:grid;gap:2px;max-height:0;opacity:0;overflow:hidden;padding:0 0 0 8px;transform:translateY(-4px);transition:max-height .34s cubic-bezier(.2,.7,.2,1),opacity .2s ease,transform .28s ease,padding .28s ease}
    .module-lessons.expanded{max-height:1100px;opacity:1;transform:translateY(0);padding:4px 0 7px 8px}
    .sidebar-lesson{position:relative;width:100%;min-height:38px;border:0;background:transparent;border-radius:8px;padding:8px 10px;color:var(--muted);text-align:left;font-size:12px;font-weight:500;line-height:1.35;cursor:pointer;transition:background .16s ease,color .16s ease,transform .16s ease}
    .sidebar-lesson:hover{background:var(--surface-2);color:var(--text);transform:translateX(2px)}
    .sidebar-lesson.active{background:var(--accent-soft);color:var(--accent-text);font-weight:500}
    .sidebar-lesson.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent);animation:growBar .2s ease both}

    .main-pane{min-width:0;padding:40px clamp(24px,5vw,64px) 64px}
    .lesson{width:min(820px,100%);margin:0 auto;animation:lessonIn .3s ease both}
    .crumb{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin-bottom:24px}
    .crumb button{border:0;background:none;padding:0;color:var(--muted);cursor:pointer}
    .crumb button:hover{color:var(--text)}
    .lesson-kicker{margin:0 0 10px;color:var(--accent);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em}
    .lesson h1{margin:0 0 28px;font-size:clamp(32px,4.7vw,50px);line-height:1.08;letter-spacing:-1.7px;overflow-wrap:anywhere}
    .material{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:clamp(20px,4vw,30px);box-shadow:0 6px 20px rgba(20,28,36,.03)}
    .material h2{margin:0 0 8px;font-size:18px}
    .material p{margin:0;color:var(--muted);line-height:1.7}
    .sample{margin-top:22px}
    .sample-label{margin-bottom:8px;color:var(--muted);font-size:11px;font-weight:700}
    pre{margin:0;border-radius:12px;background:var(--code);color:var(--code-text);padding:17px;overflow-x:auto;font:13px/1.6 "SFMono-Regular",Consolas,"Liberation Mono",monospace}
    .pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
    .pager-btn{max-width:48%;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:11px 13px;font-size:12px;font-weight:650;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .16s ease,transform .16s ease}
    .pager-btn:hover{background:var(--surface-2);transform:translateY(-1px)}
    .pager-btn:disabled{opacity:.35;cursor:default;transform:none}
    .backdrop{display:none}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    @keyframes lessonIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes codeLine{to{opacity:1;transform:translateY(0)}}
    @keyframes resultIn{to{opacity:1}}
    @keyframes rowIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:translateX(0)}}
    @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
    @keyframes growBar{from{transform:scaleY(.25);opacity:0}to{transform:scaleY(1);opacity:1}}

    @media(max-width:900px){
      :root{--sidebar:252px}
      .sql-card{grid-template-columns:1fr minmax(300px,.9fr)}
      .sql-info{min-height:350px}
      .sql-visual{min-height:322px;padding:26px}
      .main-pane{padding-left:24px;padding-right:24px}
    }
    @media(max-width:720px){
      :root{--header:58px}
      .app-header{height:var(--header)}
      .header-inner{padding:0 12px}
      .brand{font-size:15px}.brand-mark{width:30px;height:30px}
      .menu-btn{display:grid}
      .learning-shell{display:block;min-height:calc(100vh - var(--header))}
      .course-sidebar{position:fixed;z-index:90;top:var(--header);left:0;bottom:0;width:min(86vw,310px);height:auto;transform:translateX(-103%);transition:transform .2s cubic-bezier(.2,.7,.2,1);box-shadow:18px 0 42px rgba(0,0,0,.18)}
      .course-sidebar.open{transform:translateX(0)}
      .backdrop{position:fixed;z-index:80;inset:var(--header) 0 0;background:rgba(0,0,0,.38);display:none;opacity:0}
      .backdrop.open{display:block;animation:fadeBackdrop .18s ease forwards}
      .main-pane{padding:26px 15px 44px}
      .pager{flex-direction:column}.pager-btn{max-width:none;width:100%}
      .home{width:min(100% - 28px,1160px);padding:36px 0 48px}
      .sql-card{grid-template-columns:1fr}
      .sql-info{min-height:auto;padding:28px}
      .eyebrow{margin-bottom:26px}
      .sql-visual{min-height:290px;margin:0 14px 14px;border-radius:16px;padding:22px}
      .upcoming-grid{grid-template-columns:1fr}
      .upcoming-card{min-height:136px}
      .upcoming-top{margin-bottom:24px}
    }
    @media(max-width:460px){
      .home{width:min(100% - 20px,1160px)}
      .home-head{margin-bottom:18px}
      .sql-info{padding:24px 20px}
      .sql-info h2{font-size:54px}
      .sql-meta{gap:6px}.sql-meta span{padding:6px 8px;font-size:10px}
      .sql-visual{min-height:260px;padding:14px;margin-left:10px;margin-right:10px;margin-bottom:10px}
      .terminal-body{padding:17px 15px}.query{font-size:10px}.result-row{font-size:9px;grid-template-columns:34px 1fr 60px}
    }
    @keyframes fadeBackdrop{to{opacity:1}}
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button class="brand" id="brandBtn" aria-label="Kezdőlap"><span class="brand-mark">SM</span><span>SchoolMaterials</span></button>
      <div class="header-actions">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Tananyag menü" title="Tananyag menü"></button>
        <button class="icon-btn" id="themeBtn" aria-label="Téma váltása" title="Téma váltása"></button>
      </div>
    </div>
  </header>
  <div id="app"></div>

  <script>
    const modules=[
      {title:'Adatbázis-kezelés 1',lessons:[
        'Adatbázis, tábla, rekord, mező és az SQL alapjai','SELECT, FROM és oszlopok lekérdezése','WHERE és összehasonlító feltételek','DISTINCT, ORDER BY, ASC és DESC','Több feltétel – AND, OR, NOT','NULL, IS NULL és IS NOT NULL','Adatmódosítás – INSERT, UPDATE, DELETE','Összesítés – COUNT, SUM, AVG, MIN, MAX','Csoportosítás – GROUP BY és HAVING','Rendezés, szűrés, csoportosítás és összesítés egy lekérdezésben','Adatbázis és tábla létrehozása','SQL adattípusok','Alapvető megszorítások – PRIMARY KEY, NOT NULL, UNIQUE','Egytáblás komplex gyakorlás','Egytáblás SQL számonkérés']},
      {title:'Adatbázis-kezelés 2',lessons:[
        'Relációs adatbázisok felépítése','Elsődleges és idegen kulcsok','Táblák közötti kapcsolatok','Többtáblás adatbázis létrehozása','Adatbázis-tervezés','Redundanciamentes adatbázis-tervezés','Adatbázismodell-diagram készítése','Többtáblás lekérdezések alapjai','INNER JOIN','Külső JOIN-ok, elsősorban LEFT JOIN','Több tábla összekapcsolása egy lekérdezésben','JOIN + WHERE + ORDER BY','JOIN + összesítő függvények','JOIN + GROUP BY + HAVING','Összetett / haladó SQL-lekérdezések','Komplex többtáblás adatbázis-tervezési feladat','Adatbázis exportálása / dump készítése','Adatbázis használata backend alkalmazásból','Adatbázist használó REST API','ORM – objektum-relációs leképezés','Adatbázist kezelő konzolos / grafikus alkalmazás','Komplex webes + adatbázis-kezelési vizsgafeladat','Szakmai vizsga típusú adatbázis-feladatok']}
    ];

    const app=document.getElementById('app');
    const themeBtn=document.getElementById('themeBtn');
    const menuBtn=document.getElementById('menuBtn');
    const brandBtn=document.getElementById('brandBtn');
    const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.3 15.5A8.5 8.5 0 0 1 8.5 3.7 8.5 8.5 0 1 0 20.3 15.5Z"/></svg>';
    const sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.6"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>';
    const menuIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
    const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg>';
    menuBtn.innerHTML=menuIcon;

    let currentModule=0;
    let currentLesson=0;
    let learningMounted=false;

    function setTheme(t){
      document.documentElement.dataset.theme=t;
      document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0e1114':'#f4f5f7';
      themeBtn.innerHTML=t==='dark'?sun:moon;
      localStorage.setItem('schoolmaterials-theme',t);
    }
    const saved=localStorage.getItem('schoolmaterials-theme');
    setTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
    themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
    brandBtn.onclick=showHome;
    menuBtn.onclick=toggleSidebar;

    function flatLessons(){return modules.flatMap((m,mi)=>m.lessons.map((title,li)=>({mi,li,title,module:m.title})))}
    function flatIndex(mi,li){return modules.slice(0,mi).reduce((n,m)=>n+m.lessons.length,0)+li}

    function sidebarHtml(){
      return `<aside class="course-sidebar" id="sidebar">
        <div class="sidebar-head">
          <button class="sidebar-home" data-home>← Kezdőlap</button>
          <h2>SQL</h2><p>Tananyagok</p>
        </div>
        <div class="accordion">
          ${modules.map((m,mi)=>`<div>
            <button class="module-toggle" data-module="${mi}">
              <span><small>Rész ${mi+1}</small><strong>${m.title}</strong></span><span class="chev">${arrow}</span>
            </button>
            <div class="module-lessons" data-lessons="${mi}">
              ${m.lessons.map((l,li)=>`<button class="sidebar-lesson" data-mi="${mi}" data-li="${li}">${l}</button>`).join('')}
            </div>
          </div>`).join('')}
        </div>
      </aside><div class="backdrop" id="backdrop"></div>`;
    }

    function mountLearningShell(){
      if(learningMounted) return;
      app.innerHTML=`<div class="learning-shell">${sidebarHtml()}<main class="main-pane" id="mainPane"></main></div>`;
      learningMounted=true;
      bindSidebar();
    }

    function bindSidebar(){
      document.querySelector('[data-home]')?.addEventListener('click',showHome);
      document.querySelectorAll('[data-module]').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const mi=Number(btn.dataset.module);
          const already=btn.classList.contains('expanded');
          setOpenModule(already?-1:mi);
        });
      });
      document.querySelectorAll('[data-mi]').forEach(btn=>btn.addEventListener('click',()=>{
        closeSidebar();
        showLesson(Number(btn.dataset.mi),Number(btn.dataset.li));
      }));
      document.getElementById('backdrop')?.addEventListener('click',closeSidebar);
    }

    function setOpenModule(openModule){
      document.querySelectorAll('[data-module]').forEach(btn=>btn.classList.toggle('expanded',Number(btn.dataset.module)===openModule));
      document.querySelectorAll('[data-lessons]').forEach(panel=>panel.classList.toggle('expanded',Number(panel.dataset.lessons)===openModule));
    }

    function updateSidebarState(mi,li){
      setOpenModule(mi);
      document.querySelectorAll('[data-module]').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.module)===mi));
      document.querySelectorAll('[data-mi]').forEach(btn=>{
        const active=Number(btn.dataset.mi)===mi&&Number(btn.dataset.li)===li;
        btn.classList.toggle('active',active);
        if(active) btn.setAttribute('aria-current','page'); else btn.removeAttribute('aria-current');
      });
    }

    function toggleSidebar(){
      document.getElementById('sidebar')?.classList.toggle('open');
      document.getElementById('backdrop')?.classList.toggle('open');
    }
    function closeSidebar(){
      document.getElementById('sidebar')?.classList.remove('open');
      document.getElementById('backdrop')?.classList.remove('open');
    }

    function showHome(){
      closeSidebar();
      menuBtn.style.display='none';
      learningMounted=false;
      window.scrollTo(0,0);
      app.innerHTML=`<main class="home">
        <header class="home-head">
          <p class="home-label">SchoolMaterials</p>
          <h1>Tananyagok</h1>
          <p class="home-copy">Belső oktatási felület.</p>
        </header>
        <button class="sql-card" id="sqlCard" aria-label="SQL tananyag megnyitása">
          <div class="sql-info">
            <div class="eyebrow"><span class="eyebrow-dot"></span>SQL tananyag</div>
            <h2>SQL</h2>
            <p>Adatbázis-kezelés, lekérdezések, relációs adatbázisok és a szakmai vizsgához szükséges témák.</p>
            <div class="sql-meta"><span>Adatbázis-kezelés 1</span><span>Adatbázis-kezelés 2</span></div>
            <div class="course-cta">Megnyitás <i>${arrow}</i></div>
          </div>
          <div class="sql-visual" aria-hidden="true">
            <div class="terminal">
              <div class="terminal-head"><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-title">query.sql</span></div>
              <div class="terminal-body">
                <div class="query">
                  <div class="query-line"><span class="kw">SELECT</span> id, nev, osztaly</div>
                  <div class="query-line"><span class="kw">FROM</span> tanulok</div>
                  <div class="query-line"><span class="kw">WHERE</span> atlag &gt; <span class="str">4.0</span><span class="cursor"></span></div>
                </div>
                <div class="result">
                  <div class="result-head"><span>ID</span><span>NÉV</span><span>OSZTÁLY</span></div>
                  <div class="result-row"><span>01</span><span>Kiss Anna</span><span>10.A</span></div>
                  <div class="result-row"><span>07</span><span>Nagy Máté</span><span>10.B</span></div>
                  <div class="result-row"><span>12</span><span>Tóth Luca</span><span>11.A</span></div>
                </div>
              </div>
            </div>
          </div>
        </button>
        <section class="upcoming-grid" aria-label="További tananyagok">
          <article class="upcoming-card">
            <div class="upcoming-top"><span class="upcoming-code">JS</span><span class="upcoming-state">Hamarosan</span></div>
            <h3>JavaScript</h3>
            <p>Programozási alapok, DOM, események és aszinkron működés.</p>
          </article>
          <article class="upcoming-card">
            <div class="upcoming-top"><span class="upcoming-code">FE</span><span class="upcoming-state">Hamarosan</span></div>
            <h3>Frontend</h3>
            <p>Kliensoldali webfejlesztés, felületek és modern frontend technológiák.</p>
          </article>
          <article class="upcoming-card">
            <div class="upcoming-top"><span class="upcoming-code">BE</span><span class="upcoming-state">Hamarosan</span></div>
            <h3>Backend</h3>
            <p>Szerveroldali fejlesztés, API-k, adatkezelés és alkalmazáslogika.</p>
          </article>
        </section>
      </main>`;
      document.getElementById('sqlCard').onclick=()=>showLesson(0,0);
    }

    function renderLessonContent(mi,li){
      const flat=flatLessons();
      const idx=flatIndex(mi,li);
      const prev=flat[idx-1];
      const next=flat[idx+1];
      const title=modules[mi].lessons[li];
      const pane=document.getElementById('mainPane');
      pane.innerHTML=`<article class="lesson">
        <div class="crumb"><button id="homeCrumb">Kezdőlap</button><span>/</span><span>SQL</span><span>/</span><span>${modules[mi].title}</span></div>
        <p class="lesson-kicker">${modules[mi].title}</p>
        <h1>${title}</h1>
        <section class="material">
          <h2>Tananyag</h2>
          <p>A részletes oktatási tartalom ide kerül.</p>
          <div class="sample"><div class="sample-label">SQL példa</div><pre><code>SELECT *\nFROM tabla;</code></pre></div>
        </section>
        <nav class="pager">
          <button class="pager-btn" id="prev" ${prev?'':'disabled'}>${prev?'← '+prev.title:'← Előző'}</button>
          <button class="pager-btn" id="next" ${next?'':'disabled'}>${next?next.title+' →':'Következő →'}</button>
        </nav>
      </article>`;
      document.getElementById('homeCrumb').onclick=showHome;
      if(prev) document.getElementById('prev').onclick=()=>showLesson(prev.mi,prev.li);
      if(next) document.getElementById('next').onclick=()=>showLesson(next.mi,next.li);
    }

    function showLesson(mi,li){
      currentModule=mi;
      currentLesson=li;
      menuBtn.style.display='';
      mountLearningShell();
      updateSidebarState(mi,li);
      renderLessonContent(mi,li);
      window.scrollTo({top:0,left:0,behavior:'auto'});
    }

    showHome();
  </script>
</body>
</html>
