<body>
<header class="app-header"><div class="header-inner"><button class="brand" id="brandBtn" aria-label="Kezdőlap"><span class="brand-mark">SM</span><span>SchoolMaterials</span></button><div class="header-actions"><button class="icon-btn menu-btn" id="menuBtn" aria-label="Tananyag menü"></button><button class="icon-btn" id="themeBtn" aria-label="Téma váltása"></button></div></div></header>
<div id="app"></div>
<script>
const modules=[{title:'Adatbázis-kezelés 1',lessons:['Adatbázis, tábla, rekord, mező és az SQL alapjai','SELECT, FROM és oszlopok lekérdezése','WHERE és összehasonlító feltételek','DISTINCT, ORDER BY, ASC és DESC','Több feltétel – AND, OR, NOT','NULL, IS NULL és IS NOT NULL','Adatmódosítás – INSERT, UPDATE, DELETE','Összesítés – COUNT, SUM, AVG, MIN, MAX','Csoportosítás – GROUP BY és HAVING','Rendezés, szűrés, csoportosítás és összesítés egy lekérdezésben','Adatbázis és tábla létrehozása','SQL adattípusok','Alapvető megszorítások – PRIMARY KEY, NOT NULL, UNIQUE','Egytáblás komplex gyakorlás','Egytáblás SQL számonkérés']},{title:'Adatbázis-kezelés 2',lessons:['Relációs adatbázisok felépítése','Elsődleges és idegen kulcsok','Táblák közötti kapcsolatok','Többtáblás adatbázis létrehozása','Adatbázis-tervezés','Redundanciamentes adatbázis-tervezés','Adatbázismodell-diagram készítése','Többtáblás lekérdezések alapjai','INNER JOIN','Külső JOIN-ok, elsősorban LEFT JOIN','Több tábla összekapcsolása egy lekérdezésben','JOIN + WHERE + ORDER BY','JOIN + összesítő függvények','JOIN + GROUP BY + HAVING','Összetett / haladó SQL-lekérdezések','Komplex többtáblás adatbázis-tervezési feladat','Adatbázis exportálása / dump készítése','Adatbázis használata backend alkalmazásból','Adatbázist használó REST API','ORM – objektum-relációs leképezés','Adatbázist kezelő konzolos / grafikus alkalmazás','Komplex webes + adatbázis-kezelési vizsgafeladat','Szakmai vizsga típusú adatbázis-feladatok']}];
const app=document.getElementById('app'),themeBtn=document.getElementById('themeBtn'),menuBtn=document.getElementById('menuBtn'),brandBtn=document.getElementById('brandBtn');
const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.3 15.5A8.5 8.5 0 0 1 8.5 3.7 8.5 8.5 0 1 0 20.3 15.5Z"/></svg>',sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.6"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>',menuIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 18 6-6-6-6"/></svg>';
menuBtn.innerHTML=menuIcon;let learningMounted=false,jsDemoInterval=null,jsDemoKickoff=null,jsDemoCount=0;
function setTheme(t){document.documentElement.dataset.theme=t;document.querySelector('meta[name="theme-color"]').content=t==='dark'?'#0e1114':'#f4f5f7';themeBtn.innerHTML=t==='dark'?sun:moon;localStorage.setItem('schoolmaterials-theme',t)}
setTheme(localStorage.getItem('schoolmaterials-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');brandBtn.onclick=showHome;menuBtn.onclick=toggleSidebar;
function stopJsDemo(){if(jsDemoInterval)clearInterval(jsDemoInterval);if(jsDemoKickoff)clearTimeout(jsDemoKickoff);jsDemoInterval=null;jsDemoKickoff=null}
function resetJsDemo(){stopJsDemo();jsDemoCount=0;const btn=document.getElementById('jsActionButton'),btnCount=document.getElementById('jsButtonCount'),consoleCount=document.getElementById('jsConsoleCount'),consoleBox=document.getElementById('jsConsole');if(btn)btn.classList.remove('is-active');if(btnCount)btnCount.textContent='0';if(consoleCount)consoleCount.textContent='0';if(consoleBox)consoleBox.classList.remove('changed')}
function runJsDemoStep(){const btn=document.getElementById('jsActionButton'),btnCount=document.getElementById('jsButtonCount'),consoleCount=document.getElementById('jsConsoleCount'),consoleBox=document.getElementById('jsConsole');if(!btn||!btnCount||!consoleCount||!consoleBox)return;btn.classList.add('is-active');setTimeout(()=>{if(!document.body.contains(btn))return;jsDemoCount=jsDemoCount>=10?1:jsDemoCount+1;btnCount.textContent=jsDemoCount;consoleCount.textContent=jsDemoCount;consoleBox.classList.remove('changed');void consoleBox.offsetWidth;consoleBox.classList.add('changed');setTimeout(()=>{if(document.body.contains(btn))btn.classList.remove('is-active')},180)},220)}
function startJsDemo(){stopJsDemo();if(document.hidden||!document.getElementById('jsActionButton'))return;jsDemoKickoff=setTimeout(()=>{jsDemoKickoff=null;runJsDemoStep();jsDemoInterval=setInterval(runJsDemoStep,1250)},280)}
function setupHoverAnimations(){const cards=[...document.querySelectorAll('.course-card')];cards.forEach(card=>{card.addEventListener('mouseenter',()=>{cards.forEach(other=>{if(other!==card)other.classList.remove('is-animating')});card.classList.add('is-animating');if(card.classList.contains('js-card')){resetJsDemo();startJsDemo()}else stopJsDemo()});card.addEventListener('mouseleave',()=>{card.classList.remove('is-animating');if(card.classList.contains('js-card'))resetJsDemo()})})}
document.addEventListener('visibilitychange',()=>{if(document.hidden){document.querySelectorAll('.course-card.is-animating').forEach(card=>card.classList.remove('is-animating'));resetJsDemo()}});
function flatLessons(){return modules.flatMap((m,mi)=>m.lessons.map((title,li)=>({mi,li,title,module:m.title})))}function flatIndex(mi,li){return modules.slice(0,mi).reduce((n,m)=>n+m.lessons.length,0)+li}
function sidebarHtml(){return `<aside class="course-sidebar" id="sidebar"><div class="sidebar-head"><button class="sidebar-home" data-home>← Kezdőlap</button><h2>SQL</h2><p>Tananyagok</p></div><div class="accordion">${modules.map((m,mi)=>`<div><button class="module-toggle" data-module="${mi}"><span><small>Rész ${mi+1}</small><strong>${m.title}</strong></span><span class="chev">${arrow}</span></button><div class="module-lessons" data-lessons="${mi}">${m.lessons.map((l,li)=>`<button class="sidebar-lesson" data-mi="${mi}" data-li="${li}">${l}</button>`).join('')}</div></div>`).join('')}</div></aside><div class="backdrop" id="backdrop"></div>`}
function mountLearningShell(){if(learningMounted)return;app.innerHTML=`<div class="learning-shell">${sidebarHtml()}<main class="main-pane" id="mainPane"></main></div>`;learningMounted=true;bindSidebar()}
function bindSidebar(){document.querySelector('[data-home]')?.addEventListener('click',showHome);document.querySelectorAll('[data-module]').forEach(btn=>btn.addEventListener('click',()=>{const mi=Number(btn.dataset.module),open=btn.classList.contains('expanded');setOpenModule(open?-1:mi)}));document.querySelectorAll('[data-mi]').forEach(btn=>btn.addEventListener('click',()=>{closeSidebar();showLesson(Number(btn.dataset.mi),Number(btn.dataset.li))}));document.getElementById('backdrop')?.addEventListener('click',closeSidebar)}
function setOpenModule(openModule){document.querySelectorAll('[data-module]').forEach(btn=>btn.classList.toggle('expanded',Number(btn.dataset.module)===openModule));document.querySelectorAll('[data-lessons]').forEach(panel=>panel.classList.toggle('expanded',Number(panel.dataset.lessons)===openModule))}
function updateSidebarState(mi,li){setOpenModule(mi);document.querySelectorAll('[data-module]').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.module)===mi));document.querySelectorAll('[data-mi]').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.mi)===mi&&Number(btn.dataset.li)===li))}
function toggleSidebar(){document.getElementById('sidebar')?.classList.toggle('open');document.getElementById('backdrop')?.classList.toggle('open')}function closeSidebar(){document.getElementById('sidebar')?.classList.remove('open');document.getElementById('backdrop')?.classList.remove('open')}
function showHome(){closeSidebar();resetJsDemo();menuBtn.style.display='none';learningMounted=false;window.scrollTo(0,0);app.innerHTML=`<main class="home"><header class="home-head"><p class="home-label">SchoolMaterials</p><h1>Tananyagok</h1><p class="home-copy">Belső oktatási felület.</p></header><section class="course-stack"><button class="course-card sql-card active-card" id="sqlCard" aria-label="SQL tananyag megnyitása"><div class="course-info"><div class="eyebrow"><span class="eyebrow-dot"></span>SQL tananyag</div><h2>SQL</h2><p>Adatbázis-kezelés, lekérdezések, relációs adatbázisok és a szakmai vizsgához szükséges témák.</p><div class="course-meta"><span>Adatbázis-kezelés 1</span><span>Adatbázis-kezelés 2</span></div><div class="course-cta">Megnyitás <i>${arrow}</i></div></div><div class="course-visual" aria-hidden="true"><div class="terminal"><div class="window-head"><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="window-title">query.sql</span></div><div class="terminal-body"><div class="query"><div class="query-line"><span class="kw">SELECT</span> id, nev, osztaly</div><div class="query-line"><span class="kw">FROM</span> tanulok</div><div class="query-line"><span class="kw">WHERE</span> atlag &gt; <span class="str">4.0</span><span class="cursor"></span></div></div><div class="result"><div class="result-head"><span>ID</span><span>NÉV</span><span>OSZTÁLY</span></div><div class="result-row"><span>01</span><span>Kiss Anna</span><span>10.A</span></div><div class="result-row"><span>07</span><span>Nagy Máté</span><span>10.B</span></div><div class="result-row"><span>12</span><span>Tóth Luca</span><span>11.A</span></div></div></div></div></div></button><article class="course-card js-card locked"><div class="course-info"><div class="eyebrow"><span class="eyebrow-dot"></span>JavaScript</div><h2>JavaScript</h2><p>Programozási alapok, DOM, események és aszinkron működés.</p><div class="course-meta"><span>Alapok</span><span>DOM</span><span>Aszinkron</span></div><div class="course-cta">Hamarosan <i>···</i></div></div><div class="course-visual" aria-hidden="true"><div class="js-demo-window"><div class="window-head"><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="window-title">app.js</span></div><div class="js-code-static"><span class="js-key">let</span> count = 0;\n<span class="js-key">const</span> button = document.querySelector(<span class="js-str">'#counter'</span>);\nbutton.<span class="js-fn">addEventListener</span>(<span class="js-str">'click'</span>, () =&gt; {\n  count++;\n  output.textContent = count;\n});</div><div class="js-live"><div class="js-action-button" id="jsActionButton">Kattintás <b id="jsButtonCount">0</b></div><div class="js-console" id="jsConsole"><div class="js-console-line"><span class="js-console-prompt">&gt;</span><span>count =</span><strong id="jsConsoleCount">0</strong></div><div class="js-console-note">click esemény → output frissítve</div></div></div></div></div></article><article class="course-card frontend-card locked"><div class="course-info"><div class="eyebrow"><span class="eyebrow-dot"></span>Frontend</div><h2>Frontend</h2><p>Kliensoldali webfejlesztés, felületek és modern frontend technológiák.</p><div class="course-meta"><span>HTML/CSS</span><span>React</span><span>Next.js</span></div><div class="course-cta">Hamarosan <i>···</i></div></div><div class="course-visual" aria-hidden="true"><div class="browser-window"><div class="browser-head"><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="terminal-dot"></span><span class="window-title">dashboard</span></div><div class="browser-canvas"><div class="fe-toolbar"><span class="fe-logo"></span><span class="fe-chip"></span></div><div class="info-grid"><div class="info-card"><div class="info-skeleton"><i></i><i></i><i></i></div><div class="info-content"><div class="info-icon">A</div><div class="info-label">Osztály</div><div class="info-value">12.A</div><div class="info-line"></div></div></div><div class="info-card"><div class="info-skeleton"><i></i><i></i><i></i></div><div class="info-content"><div class="info-icon">Ø</div><div class="info-label">Átlag</div><div class="info-value">4,7</div><div class="info-line"></div></div></div><div class="info-card"><div class="info-skeleton"><i></i><i></i><i></i></div><div class="info-content"><div class="info-icon">%</div><div class="info-label">Jelenlét</div><div class="info-value">96%</div><div class="info-line"></div></div></div></div></div></div></div></article><article class="course-card backend-card locked"><div class="course-info"><div class="eyebrow"><span class="eyebrow-dot"></span>Backend</div><h2>Backend</h2><p>Szerveroldali fejlesztés, API-k, adatkezelés és alkalmazáslogika.</p><div class="course-meta"><span>Node.js</span><span>REST API</span><span>Adatbázis</span></div><div class="course-cta">Hamarosan <i>···</i></div></div><div class="course-visual" aria-hidden="true"><div class="pipeline-window"><div class="response">200 OK</div><div class="flow"><div class="flow-node"><span><b>Client</b>GET /api</span></div><div class="flow-node"><span><b>API</b>Express</span></div><div class="flow-node"><span><b>DB</b>SQL</span></div><span class="packet"></span></div></div></div></article></section></main>`;document.getElementById('sqlCard').onclick=()=>showLesson(0,0);setupHoverAnimations()}
function pagerHtml(prev,next){return `<nav class="pager"><button class="pager-btn" id="prev" ${prev?'':'disabled'}>${prev?'← '+prev.title:'← Előző'}</button><button class="pager-btn" id="next" ${next?'':'disabled'}>${next?next.title+' →':'Következő →'}</button></nav>`}
function lessonOneHtml(){return `<article class="lesson"><div class="crumb"><button id="homeCrumb">Kezdőlap</button><span>/</span><span>SQL</span><span>/</span><span>Adatbázis-kezelés 1</span></div><p class="lesson-kicker">Adatbázis-kezelés 1 <span>MariaDB</span></p><h1>Az adatbázis és az SQL alapjai</h1><p class="lesson-lead">A mindennapi életben nagyon sok olyan rendszerrel találkozunk, amely nagy mennyiségű adatot tárol és kezel. Ilyen például egy iskolai nyilvántartás, egy webáruház terméklistája, egy könyvtári rendszer vagy akár egy bank ügyféladatbázisa is. Ebben a tananyagban az adatbázisok alapjaival és az SQL nyelv első elemeivel foglalkozunk.</p><div class="lesson-content"><section class="lesson-section"><h2>Mit fogsz megtanulni?</h2><p>A cél az, hogy megértsd, mit jelent az adatbázis fogalma, hogyan épül fel egy tábla, és hogyan lehet egy táblából adatokat lekérdezni.</p><div class="intro-note"><div class="intro-note-icon">MDB</div><div><strong>Ebben a tananyagban MariaDB-t használunk.</strong><p>A példák és a feladatokhoz tartozó indító script MariaDB-ben használható SQL utasításokra épül.</p></div></div></section><section class="lesson-section"><h2>Az adatbázis fogalma</h2><p>Az adatbázis olyan strukturált adattárolási forma, amelyben az információkat rendezett módon tároljuk. Az adatbázis célja, hogy az adatokat könnyen és hatékonyan lehessen kezelni.</p><p>Az adatbázis használatával lehetőség van:</p><ul><li>adatok rögzítésére,</li><li>adatok keresésére,</li><li>adatok módosítására,</li><li>adatok törlésére.</li></ul><p>Minél több adatot kell kezelni, annál fontosabb, hogy ezek ne rendezetlenül, hanem jól szervezett rendszerben legyenek eltárolva.</p></section><section class="lesson-section"><h2>Az adatbázis alapfogalmai</h2><p>Az adatbázis egyik legfontosabb eleme a <strong>tábla</strong>. A tábla sorokból és oszlopokból áll, hasonlóan egy táblázathoz.</p><div class="concept-grid"><div class="concept-card"><strong>Tábla</strong><p>Az egymáshoz tartozó adatokat sorokba és oszlopokba rendezve tárolja.</p></div><div class="concept-card"><strong>Rekord / sor</strong><p>Egy konkrét személyhez, termékhez vagy eseményhez tartozó összes adat.</p></div><div class="concept-card"><strong>Oszlop</strong><p>Egy tulajdonságot jelent, például nevet, életkort vagy osztályt.</p></div><div class="concept-card"><strong>Mező</strong><p>A sor és az oszlop metszetében található konkrét adat.</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>id</th><th>nev</th><th>osztaly</th><th>atlag</th></tr></thead><tbody><tr><td>1</td><td>Kiss Anna</td><td>10.A</td><td>4.7</td></tr><tr><td>2</td><td>Nagy Péter</td><td>10.B</td><td>3.9</td></tr></tbody></table></div><div class="term-list"><div class="term-row"><code>nev</code><span>egy oszlop a táblában</span></div><div class="term-row"><code>Kiss Anna</code><span>egy konkrét mezőérték</span></div><div class="term-row"><code>1. sor</code><span>egy tanuló teljes rekordja</span></div></div></section><section class="lesson-section"><h2>Az SQL szerepe</h2><p>Az SQL a <strong>Structured Query Language</strong> rövidítése. Ez egy olyan nyelv, amelyet relációs adatbázisok kezelésére használunk.</p><p>Az SQL segítségével lehet adatokat lekérdezni, új adatokat rögzíteni, meglévő adatokat módosítani és adatokat törölni. Ebben az első anyagban csak a lekérdezések alapjaival foglalkozunk.</p></section><section class="lesson-section"><h2>A SELECT utasítás</h2><p>Az SQL egyik legalapvetőbb utasítása a <code>SELECT</code>. Ezt akkor használjuk, amikor adatokat szeretnénk lekérdezni egy táblából. A <code>SELECT</code> utasítással megadjuk, hogy mely adatokat szeretnénk látni, a <code>FROM</code> kulcsszóval pedig azt, hogy melyik táblából kérjük le azokat.</p><div class="code-card"><div class="code-head"><b>Egyszerű MariaDB lekérdezés</b><span>SQL</span></div><pre><code><span class="sql-key">SELECT</span> * <span class="sql-key">FROM</span> tanulok;</code></pre></div><div class="code-explain"><div><code>SELECT</code><span>adatok lekérdezése</span></div><div><code>*</code><span>az összes oszlop lekérdezése</span></div><div><code>FROM tanulok</code><span>a <code>tanulok</code> nevű táblából kérjük az adatokat</span></div></div></section><section class="lesson-section"><h2>Egyszerű lekérdezések</h2><p>MariaDB-ben ugyanazzal a <code>SELECT ... FROM ...</code> szerkezettel kérheted le az összes oszlopot, egyetlen oszlopot vagy több kiválasztott oszlopot.</p><div class="example-stack"><div class="example-item"><p>A tábla minden oszlopa:</p><code>SELECT * FROM tanulok;</code></div><div class="example-item"><p>Csak a tanulók neve:</p><code>SELECT nev FROM tanulok;</code></div><div class="example-item"><p>A nevek és az osztályok:</p><code>SELECT nev, osztaly FROM tanulok;</code></div><div class="example-item"><p>A nevek és az átlagok:</p><code>SELECT nev, atlag FROM tanulok;</code></div></div></section><section class="lesson-section"><h2>A FROM szerepe</h2><p>A <code>FROM</code> kulcsszó azt jelöli, hogy melyik táblából szeretnénk adatot kérni.</p><div class="code-card"><div class="code-head"><b>Példa</b><span>SQL</span></div><pre><code><span class="sql-key">SELECT</span> nev <span class="sql-key">FROM</span> tanulok;</code></pre></div><p>Ebben a lekérdezésben a <code>nev</code> oszlop adatait a <code>tanulok</code> nevű táblából kérjük le. Ha a tábla nevét hibásan írjuk le, a lekérdezés nem fog működni, mert az adatbázis nem talál ilyen nevű táblát.</p></section><section class="lesson-section"><h2>Miért nem célszerű mindig a <code>*</code> használata?</h2><p>A tanulás elején a <code>SELECT *</code> hasznos, mert egyszerű és gyors megoldás. Később azonban célszerű csak azokat az oszlopokat lekérdezni, amelyekre valóban szükség van.</p><div class="example-stack"><div class="example-item"><p>Célzott lekérdezés:</p><code>SELECT nev, atlag FROM tanulok;</code></div><div class="example-item"><p>Minden oszlop lekérdezése:</p><code>SELECT * FROM tanulok;</code></div></div><div class="tip"><strong>Gondolkodj oszlopokban.</strong><p>Ha csak a név és az átlag kell, a célzott lekérdezés átláthatóbb, mint az összes oszlop lekérése.</p></div></section><section class="lesson-section"><h2>Minta a lekérdezések értelmezéséhez</h2><p>Tegyük fel, hogy a <code>tanulok</code> tábla a következő adatokat tartalmazza:</p><div class="table-wrap"><table class="data-table"><thead><tr><th>id</th><th>nev</th><th>eletkor</th><th>osztaly</th><th>atlag</th></tr></thead><tbody><tr><td>1</td><td>Kiss Anna</td><td>16</td><td>10.A</td><td>4.7</td></tr><tr><td>2</td><td>Nagy Péter</td><td>17</td><td>10.B</td><td>3.9</td></tr><tr><td>3</td><td>Tóth Réka</td><td>16</td><td>10.A</td><td>4.4</td></tr></tbody></table></div><div class="example-stack"><div class="example-item"><p>A teljes tábla:</p><code>SELECT * FROM tanulok;</code></div><div class="example-item"><p>Csak a nevek:</p><code>SELECT nev FROM tanulok;</code></div><div class="example-item"><p>Nevek és osztályok:</p><code>SELECT nev, osztaly FROM tanulok;</code></div><div class="example-item"><p>Nevek és átlagok:</p><code>SELECT nev, atlag FROM tanulok;</code></div></div></section><section class="lesson-section"><h2>MariaDB indító script a feladatokhoz</h2><div class="script-note">A tananyaghoz használt <code>iskola</code> adatbázis és <code>tanulok</code> tábla létrehozása</div><p>Az alábbi script létrehozza az adatbázist, a táblát és a gyakorláshoz szükséges mintaadatokat.</p><div class="code-card"><div class="code-head"><b>00_tanulok_alap.sql</b><span>MariaDB</span></div><pre><code><span class="sql-key">CREATE DATABASE IF NOT EXISTS</span> iskola;
<span class="sql-key">USE</span> iskola;

<span class="sql-key">DROP TABLE IF EXISTS</span> tanulok;

<span class="sql-key">CREATE TABLE</span> tanulok (
    id <span class="sql-key">INT AUTO_INCREMENT PRIMARY KEY</span>,
    nev <span class="sql-key">VARCHAR</span>(100) <span class="sql-key">NOT NULL</span>,
    eletkor <span class="sql-key">INT NOT NULL</span>,
    osztaly <span class="sql-key">VARCHAR</span>(10) <span class="sql-key">NOT NULL</span>,
    atlag <span class="sql-key">DECIMAL</span>(3,1) <span class="sql-key">NOT NULL</span>
);

<span class="sql-key">INSERT INTO</span> tanulok (nev, eletkor, osztaly, atlag) <span class="sql-key">VALUES</span>
('Kiss Anna', 16, '10.A', 4.7),
('Nagy Péter', 17, '10.B', 3.9),
('Tóth Réka', 16, '10.A', 4.4),
('Szabó Márk', 15, '9.C', 3.6),
('Varga Dóra', 17, '11.B', 4.9),
('Kovács Levente', 16, '10.C', 4.1),
('Molnár Eszter', 15, '9.A', 4.3),
('Balogh Máté', 17, '11.A', 3.8),
('Horváth Lilla', 16, '10.B', 4.6),
('Juhász Bence', 15, '9.B', 3.5);</code></pre></div></section></div></article>`}
function renderLessonContent(mi,li){const flat=flatLessons(),idx=flatIndex(mi,li),prev=flat[idx-1],next=flat[idx+1],pane=document.getElementById('mainPane');if(mi===0&&li===0){pane.innerHTML=lessonOneHtml()+pagerHtml(prev,next)}else{const title=modules[mi].lessons[li];pane.innerHTML=`<article class="lesson"><div class="crumb"><button id="homeCrumb">Kezdőlap</button><span>/</span><span>SQL</span><span>/</span><span>${modules[mi].title}</span></div><p class="lesson-kicker">${modules[mi].title} <span>MariaDB</span></p><h1>${title}</h1><section class="lesson-section"><h2>Tananyag</h2><p>A részletes MariaDB-specifikus oktatási tartalom ide kerül.</p></section></article>`+pagerHtml(prev,next)}document.getElementById('homeCrumb').onclick=showHome;if(prev)document.getElementById('prev').onclick=()=>showLesson(prev.mi,prev.li);if(next)document.getElementById('next').onclick=()=>showLesson(next.mi,next.li)}
function showLesson(mi,li){resetJsDemo();menuBtn.style.display='';mountLearningShell();updateSidebarState(mi,li);renderLessonContent(mi,li);window.scrollTo({top:0,left:0,behavior:'auto'})}
showHome();
</script>
